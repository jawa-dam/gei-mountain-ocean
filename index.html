<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>GEI Ultimate Edition 2.3 | YALLTOO</title>
<meta name="description" content="GEI Ultimate Edition 2.3. Tap your way from Mountain to Ocean in this hydraulic learning game.">
<style>

:root{
  --cyan:#00e5ff;
  --indigo:#4d3dff;
  --magenta:#ff00c8;
  --pink:#ff6ec7;
  --gold:#ffd400;
  --black:#04050c;

  --glass: rgba(255,255,255,.08);
  --glassBorder: rgba(255,255,255,.14);
  --panel: rgba(6,8,16,.86);
  --text:#ffffff;
  --success:#39ffb0;
  --warning:#ffd84d;
  --danger:#ff3d6b;
  --radius:22px;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,sans-serif;
  background:radial-gradient(circle at 50% 0%,#1c1454,#04050c 70%);
  color:white;
  -webkit-tap-highlight-color:transparent;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

.bg{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }

.bgGlow{
  position:absolute;
  width:clamp(300px,80vw,700px);
  height:clamp(300px,80vw,700px);
  border-radius:50%;
  background:radial-gradient(circle, rgba(0,229,255,.18), transparent 70%);
  animation:floatGlow 22s ease-in-out infinite;
}
.bgGlow:nth-child(2){
  right:-200px; bottom:-100px;
  background:radial-gradient(circle, rgba(255,0,200,.16), transparent 70%);
  animation-duration:30s;
}
@keyframes floatGlow{
  0%,100%{ transform:translateY(0px); }
  50%{ transform:translateY(-60px); }
}

.app{
  position:relative;
  width:100%;
  max-width:540px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
  z-index:5;
}

/* ============ HUD ============ */
.hud{
  background:var(--panel);
  backdrop-filter:blur(20px);
  border:1px solid var(--glassBorder);
  border-radius:var(--radius);
  padding:clamp(10px,3vw,14px);
  margin-bottom:8px;
  flex-shrink:0;
}

.hudTop{ display:flex; justify-content:space-between; align-items:center; gap:8px; }

.logo{
  font-size:clamp(.95rem,4vw,1.15rem);
  font-weight:900;
  letter-spacing:.2px;
  background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:hueSlide 6s linear infinite;
}
@keyframes hueSlide{ to{ background-position:200% center; } }

.iconBtn{
  width:38px; height:38px;
  border-radius:12px;
  border:1px solid var(--glassBorder);
  background:rgba(255,255,255,.08);
  color:white;
  font-size:1rem;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
}
.iconBtn:active{ transform:scale(.92); }

.hudRight{ display:flex; gap:6px; }

.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px; }

.stat{
  background:rgba(255,255,255,.06);
  padding:6px 4px;
  border-radius:14px;
  text-align:center;
  font-size:.68rem;
  color:rgba(255,255,255,.75);
}
.stat strong{ display:block; font-size:.95rem; margin-top:2px; color:#fff; }

.comboWrap{ display:flex; align-items:center; gap:8px; margin-top:8px; }

.xpWrap{
  flex:1;
  height:11px;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
}
.xpFill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,var(--cyan),var(--magenta),var(--gold));
  background-size:200% auto;
  box-shadow:0 0 14px rgba(0,229,255,.9);
  transition:width .35s ease;
}

.comboBadge{
  font-size:.72rem;
  font-weight:900;
  padding:5px 10px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--magenta),var(--gold));
  opacity:0;
  transform:scale(.8);
  transition:opacity .2s, transform .2s;
  white-space:nowrap;
}
.comboBadge.show{ opacity:1; transform:scale(1); }

/* ============ WORLD (pure tap zone, no text on it) ============ */
.world{
  position:relative;
  flex:1;
  overflow:hidden;
  border-radius:24px;
  background:linear-gradient(180deg,#0d2a55,#062043 55%,#03142e);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 0 40px rgba(0,229,255,.2), inset 0 0 60px rgba(0,0,0,.3);
  touch-action:manipulation;
}

.layer{ position:absolute; inset:0; pointer-events:none; }
#cloudLayer{ z-index:2; }
#mistLayer{ z-index:3; }
#particleLayer{ z-index:9; }
#foamLayer{ z-index:7; }
#fishLayer{ z-index:8; }
#boatLayer{ z-index:8; }

svg{ width:100%; height:100%; display:block; position:relative; z-index:5; }

.hotspot{ cursor:pointer; }
.hotspot .glowRing{ opacity:0; transition:opacity .2s; }
.hotspot:hover .glowRing{ opacity:.5; }
.hotspot.tapped{ animation:tapPop .28s ease; }
@keyframes tapPop{
  0%{ transform:scale(1); }
  40%{ transform:scale(1.12); }
  100%{ transform:scale(1); }
}

/* ============ FLOATING LABEL TOAST (never sits over the tap zone) ============ */
.labelToast{
  position:absolute;
  top:10px;
  left:50%;
  transform:translate(-50%,-14px);
  padding:8px 16px;
  border-radius:999px;
  background:rgba(6,8,16,.88);
  border:1px solid var(--glassBorder);
  font-weight:800;
  font-size:.85rem;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s, transform .25s;
  z-index:40;
  box-shadow:0 0 20px rgba(0,229,255,.25);
}
.labelToast.show{ opacity:1; transform:translate(-50%,0); }

.floatXP{
  position:absolute;
  font-weight:900;
  font-size:1rem;
  color:var(--gold);
  text-shadow:0 0 8px rgba(255,212,0,.8);
  pointer-events:none;
  z-index:41;
  animation:floatUp 1s ease-out forwards;
}
@keyframes floatUp{
  0%{ opacity:1; transform:translateY(0) scale(1); }
  100%{ opacity:0; transform:translateY(-60px) scale(1.2); }
}

/* ============ ACTION BAR ============ */
.bottomBar{ display:flex; gap:8px; margin-top:8px; flex-shrink:0; }

.actionBtn{
  flex:1;
  border:none;
  padding:clamp(10px,3vw,14px);
  border-radius:16px;
  font-weight:800;
  font-size:clamp(.72rem,3vw,.9rem);
  cursor:pointer;
  color:white;
  background:linear-gradient(135deg,var(--indigo),var(--magenta));
  box-shadow:0 4px 18px rgba(255,0,200,.25);
}
.actionBtn:active{ transform:scale(.96); }

/* ============ PANELS ============ */
.sidePanel{
  position:absolute; top:0; right:-100%;
  width:85%; height:100%;
  background:rgba(6,8,16,.96);
  backdrop-filter:blur(20px);
  z-index:90; padding:20px;
  transition:.4s;
  overflow:auto;
}
.sidePanel.open{ right:0; }
.panelTitle{ font-size:1.25rem; font-weight:900; margin-bottom:18px; }
.achievement{
  padding:12px; margin-bottom:10px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  transition:.3s;
}

.lessonPanel{
  position:absolute; left:8px; right:8px; bottom:8px;
  background:linear-gradient(160deg,#ffffff,#f2f4ff);
  color:#111;
  padding:18px;
  border-radius:20px;
  z-index:80;
  transform:translateY(140%);
  transition:.4s;
  max-height:65%;
  overflow:auto;
  box-shadow:0 -10px 40px rgba(0,0,0,.4);
}
.lessonPanel.show{ transform:translateY(0); }
.lessonTitle{ font-size:1.1rem; font-weight:900; color:var(--indigo); margin-bottom:8px; }
.closeLesson{
  float:right; border:none; background:rgba(0,0,0,.08);
  width:28px; height:28px; border-radius:8px; font-weight:900; cursor:pointer;
}

.rainDrop{
  position:absolute; width:2px; height:16px;
  background:rgba(0,229,255,.6);
  animation:rainFall linear forwards;
}
@keyframes rainFall{
  from{ transform:translateY(-30px); }
  to{ transform:translateY(900px); }
}

.shake{ animation:shake .4s; }
@keyframes shake{
  0%{transform:translateX(0);}
  20%{transform:translateX(-4px);}
  40%{transform:translateX(4px);}
  60%{transform:translateX(-3px);}
  80%{transform:translateX(3px);}
  100%{transform:translateX(0);}
}

.flash{ animation:flashPop .35s ease; }
@keyframes flashPop{
  0%{ box-shadow:inset 0 0 0 0 rgba(255,212,0,0); }
  40%{ box-shadow:inset 0 0 80px 10px rgba(255,212,0,.5); }
  100%{ box-shadow:inset 0 0 0 0 rgba(255,212,0,0); }
}

.foam{
  position:absolute;
  width:8px; height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  animation:foamPop 2s ease-out forwards;
}
@keyframes foamPop{
  0%{ opacity:.9; transform:scale(1) translateY(0); }
  100%{ opacity:0; transform:scale(.3) translateY(-14px); }
}

@media(max-width:480px){
  .stats{ grid-template-columns:repeat(4,1fr); }
}

/* fullscreen mode tweaks */
.app:fullscreen, .app:-webkit-full-screen{
  max-width:100%;
  background:#04050c;
}
</style>
</head>
<body>

<div class="bg">
  <div class="bgGlow"></div>
  <div class="bgGlow"></div>
</div>

<div class="app" id="appRoot">

  <!-- HUD -->
  <div class="hud">
    <div class="hudTop">
      <div class="logo">GEI Ultimate</div>
      <div class="hudRight">
        <button class="iconBtn" id="fullscreenBtn" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>
        <button class="iconBtn" id="museumBtn" title="Achievements" aria-label="Achievements">🏆</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">XP<strong id="xpText">0</strong></div>
      <div class="stat">Level<strong id="levelText">1</strong></div>
      <div class="stat">Days<strong id="dayText">0/6</strong></div>
      <div class="stat">Flow<strong id="flowText">0%</strong></div>
    </div>

    <div class="comboWrap">
      <div class="xpWrap"><div class="xpFill" id="xpFill"></div></div>
      <div class="comboBadge" id="comboBadge">x1</div>
    </div>
  </div>

  <!-- WORLD: tap zone stays clean, no words on top -->
  <div class="world" id="world">

    <div class="layer" id="cloudLayer"></div>
    <div class="layer" id="mistLayer"></div>
    <div class="layer" id="foamLayer"></div>
    <div class="layer" id="fishLayer"></div>
    <div class="layer" id="boatLayer"></div>
    <div class="layer" id="particleLayer"></div>

    <div class="labelToast" id="labelToast"></div>

    <svg id="worldSVG" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid meet">

      <defs>
        <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#1c1454"/>
          <stop offset="45%" stop-color="#3d1f8f"/>
          <stop offset="75%" stop-color="#0d5ba8"/>
          <stop offset="100%" stop-color="#00b7c4"/>
        </linearGradient>

        <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#8fa3ff"/>
          <stop offset="100%" stop-color="#4d3dff"/>
        </linearGradient>

        <linearGradient id="waterFillGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#7cf9ff"/>
          <stop offset="100%" stop-color="#00b7ff"/>
        </linearGradient>

        <linearGradient id="damGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffe08a"/>
          <stop offset="100%" stop-color="#ff9d3d"/>
        </linearGradient>

        <linearGradient id="wheelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff6ec7"/>
          <stop offset="100%" stop-color="#ff00c8"/>
        </linearGradient>

        <linearGradient id="millGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffd400"/>
          <stop offset="100%" stop-color="#ff9d3d"/>
        </linearGradient>

        <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00e5ff">
            <animate attributeName="offset" values="-1;1" dur="1.6s" repeatCount="indefinite"/>
          </stop>
          <stop offset="50%" stop-color="#ffffff">
            <animate attributeName="offset" values="0;2" dur="1.6s" repeatCount="indefinite"/>
          </stop>
          <stop offset="100%" stop-color="#00e5ff">
            <animate attributeName="offset" values="1;3" dur="1.6s" repeatCount="indefinite"/>
          </stop>
        </linearGradient>

        <filter id="waterGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>

        <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- SKY -->
      <rect x="0" y="0" width="400" height="800" fill="url(#skyGradient)"/>

      <!-- MOUNTAIN -->
      <g class="hotspot" data-day="1" data-name="Mountain" data-icon="🏔">
        <circle class="glowRing" cx="200" cy="140" r="95" fill="none" stroke="var(--cyan)" stroke-width="3" filter="url(#neonGlow)"/>
        <path d="M30 170 L90 70 L150 160 L220 50 L310 180 L380 120 L400 220 L0 220 Z" fill="url(#mountainGradient)"/>
        <path d="M80 85 L100 60 L120 90 Z" fill="#ffffff"/>
        <path d="M205 70 L225 45 L245 75 Z" fill="#ffffff"/>
        <text x="200" y="205" text-anchor="middle" font-size="30">🏔</text>
      </g>

      <!-- RESERVOIR -->
      <g class="hotspot" data-day="3" data-name="Reservoir" data-icon="🌊">
        <circle class="glowRing" cx="200" cy="280" r="95" fill="none" stroke="var(--cyan)" stroke-width="3" filter="url(#neonGlow)"/>
        <ellipse cx="200" cy="280" rx="120" ry="50" fill="url(#waterFillGradient)"/>
        <text x="200" y="290" text-anchor="middle" font-size="26">🌊</text>
      </g>

      <!-- DAM -->
      <g class="hotspot" data-day="2" data-name="Dam" data-icon="🏗">
        <rect class="glowRing" x="105" y="335" width="190" height="78" rx="14" fill="none" stroke="var(--gold)" stroke-width="3" filter="url(#neonGlow)"/>
        <rect x="120" y="350" width="160" height="48" rx="8" fill="url(#damGradient)"/>
        <rect x="184" y="350" width="32" height="48" fill="#b45f1c" id="gateVisual"/>
        <text x="200" y="382" text-anchor="middle" font-size="22">🏗</text>
      </g>

      <!-- MILLPOND -->
      <g class="hotspot" data-day="3" data-name="Millpond" data-icon="🌊">
        <ellipse class="glowRing" cx="200" cy="450" rx="100" ry="45" fill="none" stroke="var(--cyan)" stroke-width="3" filter="url(#neonGlow)"/>
        <ellipse cx="200" cy="450" rx="90" ry="35" fill="url(#waterFillGradient)"/>
        <text x="200" y="460" text-anchor="middle" font-size="22">🌊</text>
      </g>

      <!-- SLUICE -->
      <g class="hotspot" data-day="4" data-name="Sluice" data-icon="🚪">
        <rect class="glowRing" x="130" y="495" width="140" height="68" rx="12" fill="none" stroke="var(--magenta)" stroke-width="3" filter="url(#neonGlow)"/>
        <rect x="145" y="510" width="110" height="38" rx="6" fill="#c471ff"/>
        <text x="200" y="536" text-anchor="middle" font-size="20">🚪</text>
      </g>

      <!-- RIVER -->
      <path id="riverPath" d="M200 130 L200 240 L200 325 L200 420 L200 500 L200 600 L200 700"
        fill="none" stroke="url(#flowGradient)" stroke-width="18" stroke-linecap="round" filter="url(#waterGlow)"/>

      <!-- WATERWHEEL -->
      <g class="hotspot" data-day="5" data-name="Waterwheel" data-icon="⚙">
        <circle class="glowRing" cx="200" cy="610" r="65" fill="none" stroke="var(--magenta)" stroke-width="3" filter="url(#neonGlow)"/>
        <g id="wheelGroup">
          <circle cx="200" cy="610" r="48" fill="url(#wheelGradient)" stroke="#ffffff" stroke-width="3"/>
          <line x1="200" y1="562" x2="200" y2="658" stroke="#ffffff" stroke-width="5"/>
          <line x1="152" y1="610" x2="248" y2="610" stroke="#ffffff" stroke-width="5"/>
          <line x1="166" y1="576" x2="234" y2="644" stroke="#ffffff" stroke-width="4"/>
          <line x1="234" y1="576" x2="166" y2="644" stroke="#ffffff" stroke-width="4"/>
          <circle cx="200" cy="610" r="10" fill="#ffffff"/>
        </g>
        <text x="200" y="695" text-anchor="middle" font-size="20">⚙</text>
      </g>

      <!-- MILL -->
      <g class="hotspot" data-day="6" data-name="Mill" data-icon="🏭">
        <rect class="glowRing" x="118" y="640" width="164" height="135" rx="14" fill="none" stroke="var(--gold)" stroke-width="3" filter="url(#neonGlow)"/>
        <rect x="130" y="705" width="140" height="60" fill="url(#millGradient)"/>
        <polygon points="120,705 200,650 280,705" fill="#ff6ec7"/>
        <text x="200" y="750" text-anchor="middle" font-size="20">🏭</text>
      </g>

      <!-- OCEAN -->
      <g class="hotspot" data-day="0" data-name="Ocean" data-icon="🌊">
        <path id="oceanWave" d="M0 760 Q50 740 100 760 Q150 780 200 760 Q250 740 300 760 Q350 780 400 760 L400 800 L0 800 Z" fill="#00e5ff"/>
        <text x="200" y="792" text-anchor="middle" font-size="20">🌊</text>
      </g>

    </svg>

    <!-- ACHIEVEMENT MUSEUM -->
    <div class="sidePanel" id="museumPanel">
      <div class="panelTitle">🏆 Achievement Museum</div>
      <div class="achievement" data-key="day1">🌄 Gravity Discovered</div>
      <div class="achievement" data-key="day2">🏗 Heaven Constructed</div>
      <div class="achievement" data-key="day3">🌎 Earth Gathered</div>
      <div class="achievement" data-key="day4">🚪 Flow Regulated</div>
      <div class="achievement" data-key="day5">⚙ Great Whales Activated</div>
      <div class="achievement" data-key="day6">🏭 Beast System Online</div>
      <div class="achievement" data-key="ocean">🌊 Ocean Reached</div>
      <div class="achievement" data-key="flood">🌩 Flood Master</div>
    </div>

    <!-- ACADEMY / LESSON PANEL -->
    <div class="lessonPanel" id="lessonPanel">
      <button class="closeLesson" id="closeLessonBtn">✕</button>
      <div class="lessonTitle" id="lessonTitle">GEI Academy</div>
      <div id="lessonContent">Tap a glowing location to begin your GEI journey.</div>
    </div>

  </div>

  <!-- CONTROLS -->
  <div class="bottomBar">
    <button class="actionBtn" id="academyBtn">🎓 Academy</button>
    <button class="actionBtn" id="gateBtn">🚪 Gate</button>
  </div>

</div>

<script>

/* ===================== GEI CORE ENGINE ===================== */
const GEI = {
  xp:0,
  level:1,
  reservoirLevel:100,
  pressure:1,
  flowRate:0,
  gatePosition:0,
  wheelSpeed:0,
  wheelAngle:0,
  weather:"sunny",
  flood:false,
  daysFound:new Set(),
  combo:1,
  comboTimer:null
};

const world = document.getElementById("world");
const appRoot = document.getElementById("appRoot");
const museumPanel = document.getElementById("museumPanel");
const lessonPanel = document.getElementById("lessonPanel");
const lessonTitle = document.getElementById("lessonTitle");
const lessonContent = document.getElementById("lessonContent");
const xpText = document.getElementById("xpText");
const levelText = document.getElementById("levelText");
const xpFill = document.getElementById("xpFill");
const flowText = document.getElementById("flowText");
const dayText = document.getElementById("dayText");
const wheelGroup = document.getElementById("wheelGroup");
const gateVisual = document.getElementById("gateVisual");
const labelToast = document.getElementById("labelToast");
const comboBadge = document.getElementById("comboBadge");
const particleLayer = document.getElementById("particleLayer");
const foamLayer = document.getElementById("foamLayer");

/* ===================== LESSON DATA ===================== */
const LESSONS = {
  1:{ title:"Day 1 — Separation", text:"Released water represents movement and separation. Stored potential becomes active flow." },
  2:{ title:"Day 2 — Containment", text:"The dam represents containment. Water can now be managed, directed, and regulated." },
  3:{ title:"Day 3 — Storage", text:"Reservoirs and millponds store energy. Collected water becomes a resource." },
  4:{ title:"Day 4 — Regulation", text:"Sluice gates regulate movement and control downstream pressure." },
  5:{ title:"Day 5 — Mechanical Conversion", text:"The waterwheel converts moving water into useful mechanical work." },
  6:{ title:"Day 6 — Complete System", text:"The entire hydraulic chain operates together as one integrated system." }
};

/* ===================== XP + COMBO ===================== */
function updateXP(){
  xpText.textContent = GEI.xp;
  levelText.textContent = GEI.level;
  const currentLevelXP = GEI.level * 100;
  xpFill.style.width = Math.min(100, (GEI.xp/currentLevelXP)*100) + "%";
}

function bumpCombo(){
  GEI.combo = Math.min(GEI.combo + 1, 9);
  comboBadge.textContent = "x" + GEI.combo;
  comboBadge.classList.add("show");
  clearTimeout(GEI.comboTimer);
  GEI.comboTimer = setTimeout(()=>{
    GEI.combo = 1;
    comboBadge.classList.remove("show");
  }, 1600);
}

function awardXP(amount, x, y){
  const total = Math.round(amount * GEI.combo);
  GEI.xp += total;
  const nextLevel = GEI.level * 100;
  if(GEI.xp >= nextLevel){
    GEI.level++;
    playLevelUp();
    flashScreen();
  }
  updateXP();
  if(typeof x === "number") spawnFloatXP(total, x, y);
}

function spawnFloatXP(amount, x, y){
  const el = document.createElement("div");

/* ===================== FULLSCREEN ===================== */
const fullscreenBtn = document.getElementById("fullscreenBtn");
function isFullscreen(){
  return document.fullscreenElement || document.webkitFullscreenElement;
}
function toggleFullscreen(){
  if(!isFullscreen()){
    const req = appRoot.requestFullscreen || appRoot.webkitRequestFullscreen;
    if(req) req.call(appRoot);
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit) exit.call(document);
  }
}
fullscreenBtn.addEventListener("click", toggleFullscreen);
document.addEventListener("fullscreenchange", ()=>{
  fullscreenBtn.textContent = isFullscreen() ? "⤢" : "⛶";
});
document.addEventListener("webkitfullscreenchange", ()=>{
  fullscreenBtn.textContent = isFullscreen() ? "⤢" : "⛶";
});

/* ===================== LABEL TOAST (floats above world, never blocks taps) ===================== */
let toastTimer;
function showLabelToast(icon, name){
  labelToast.textContent = icon + "  " + name;
  labelToast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> labelToast.classList.remove("show"), 1100);
}

/* ===================== TAP HANDLING ===================== */
document.querySelectorAll(".hotspot").forEach(node=>{
  node.addEventListener("click", (e)=>{
    const day = Number(node.dataset.day);
    const name = node.dataset.name;
    const icon = node.dataset.icon;

    node.classList.remove("tapped");
    void node.offsetWidth;
    node.classList.add("tapped");

    const rect = world.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    bumpCombo();
    awardXP(20, px, py);
    spawnFoam(px, py);
    playDiscovery();
    showLabelToast(icon, name);

    if(day > 0 && !GEI.daysFound.has(day)){
      GEI.daysFound.add(day);
      awardXP(50, px, py - 22);
      dayText.textContent = GEI.daysFound.size + "/6";
      unlockAchievement("day" + day);
    }
  });

  node.addEventListener("dblclick", ()=>{
    const day = Number(node.dataset.day);
    if(day > 0){
      lessonTitle.textContent = LESSONS[day].title;
      lessonContent.textContent = LESSONS[day].text;
      lessonPanel.classList.add("show");
    }
  });
});

/* ===================== AUDIO ===================== */
let audioCtx;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq,time){
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = freq;
  gain.gain.value = 0.035;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + time);
  osc.stop(ctx.currentTime + time);
}
function playDiscovery(){ playTone(320 + Math.random()*220, 0.2); }
function playLevelUp(){ playTone(650,.18); setTimeout(()=>playTone(950,.28),110); }
function playGate(){ playTone(260,.12); }
function playWheel(){ playTone(420,.08); }

/* ===================== ACHIEVEMENTS ===================== */
const ACHIEVEMENTS = { day1:false, day2:false, day3:false, day4:false, day5:false, day6:false, ocean:false, flood:false };

function unlockAchievement(key){
  if(ACHIEVEMENTS[key]) return;
  ACHIEVEMENTS[key] = true;
  awardXP(100);
  shakeWorld();
  playLevelUp();
  updateMuseum();
}

/* ===================== GATE CONTROL ===================== */
document.getElementById("gateBtn").addEventListener("click", ()=>{
  GEI.gatePosition = GEI.gatePosition ? 0 : 1;
  playGate();
});

/* ===================== PHYSICS ===================== */
function updateReservoir(){
  GEI.pressure = GEI.reservoirLevel * .01;
  GEI.flowRate = GEI.pressure * GEI.gatePosition;
  if(GEI.flood) GEI.flowRate *= 3;
  GEI.reservoirLevel = Math.max(0, GEI.reservoirLevel - GEI.flowRate * .02);
  flowText.textContent = Math.round(GEI.flowRate * 100) + "%";
}

function updateWheel(){
  GEI.wheelSpeed += GEI.flowRate * .18;
  GEI.wheelSpeed *= .985;
  GEI.wheelAngle += GEI.wheelSpeed;
  wheelGroup.setAttribute("transform", `rotate(${GEI.wheelAngle} 200 610)`);
}

function updateGateVisual(){
  if(!gateVisual) return;
  gateVisual.setAttribute("x", GEI.gatePosition ? 225 : 184);
}

let flowDash = 0;
const riverPath = document.getElementById("riverPath");
function updateRiver(){
  if(!riverPath) return;
  flowDash -= 2 + GEI.flowRate * 8;
  riverPath.style.strokeDasharray = "25 12";
  riverPath.style.strokeDashoffset = flowDash;
}

const oceanWave = document.getElementById("oceanWave");
let waveTime = 0;
function updateOcean(){
  if(!oceanWave) return;
  waveTime += 0.03 + GEI.flowRate * .03;
  const a = 760 + Math.sin(waveTime)*8;
  const b = 760 + Math.cos(waveTime)*8;
  const c = 760 + Math.sin(waveTime+1)*8;
  const d = 760 + Math.cos(waveTime+2)*8;
  oceanWave.setAttribute("d", `M0 ${a} Q50 ${b} 100 ${a} Q150 ${c} 200 ${b} Q250 ${a} 300 ${d} Q350 ${b} 400 ${a} L400 800 L0 800 Z`);
}

function checkOceanCompletion(){
  if(GEI.daysFound.size === 6 && !ACHIEVEMENTS.ocean){
    unlockAchievement("ocean");
    lessonTitle.textContent = "Journey Complete";
    lessonContent.innerHTML = "You traveled from Mountain → Reservoir → Dam → Millpond → Sluice → Waterwheel → Mill → Ocean.<br><br>+500 XP Bonus";
    awardXP(500);
    lessonPanel.classList.add("show");
  }
}

setInterval(()=>{ if(GEI.wheelSpeed > .5) playWheel(); }, 3000);

/* ===================== MUSEUM DISPLAY ===================== */
function updateMuseum(){
  document.querySelectorAll(".achievement").forEach(item=>{
    const key = item.dataset.key;
    if(ACHIEVEMENTS[key]){
      item.style.border = "2px solid var(--cyan)";
      item.style.boxShadow = "0 0 15px rgba(0,229,255,.6)";
      item.style.opacity = "1";
    } else {
      item.style.opacity = ".4";
    }
  });
}

/* ===================== MAIN LOOP ===================== */
function physicsLoop(){
  updateReservoir();
  updateWheel();
  updateGateVisual();
  updateRiver();
  updateOcean();
  checkOceanCompletion();
  requestAnimationFrame(physicsLoop);
}
physicsLoop();

/* ===================== SAVE / LOAD ===================== */
function saveGame(){
  const saveData = {
    xp:GEI.xp, level:GEI.level, reservoirLevel:GEI.reservoirLevel,
    gatePosition:GEI.gatePosition, daysFound:[...GEI.daysFound], achievements:ACHIEVEMENTS
  };
  try{ localStorage.setItem("GEI_ULTIMATE_23", JSON.stringify(saveData)); }catch(e){}
}
function loadGame(){
  let save;
  try{ save = localStorage.getItem("GEI_ULTIMATE_23"); }catch(e){ save = null; }
  if(!save) return;
  try{
    const data = JSON.parse(save);
    GEI.xp = data.xp ?? 0;
    GEI.level = data.level ?? 1;
    GEI.reservoirLevel = data.reservoirLevel ?? 100;
    GEI.gatePosition = data.gatePosition ?? 0;
    if(Array.isArray(data.daysFound)) data.daysFound.forEach(d=>GEI.daysFound.add(d));
    if(data.achievements) Object.assign(ACHIEVEMENTS, data.achievements);
    updateXP();
    dayText.textContent = GEI.daysFound.size + "/6";
  }catch(err){}
}
setInterval(saveGame, 10000);

  lessonTitle.textContent = "Welcome to GEI Ultimate";
  lessonContent.innerHTML = "Tap the glowing locations to earn XP.<br>Double-tap for a mini lesson.<br>Chain taps fast to build your combo.<br>Open the Gate to get the river flowing.<br><br>🏔 → 🌊 → 🏗 → 🌊 → 🚪 → ⚙ → 🏭 → 🌊";
  lessonPanel.classList.add("show");
  setTimeout(()=> lessonPanel.classList.remove("show"), 6000);
}

/* ===================== HOSTINGER / IFRAME HEIGHT REPORTING ===================== */
function reportHeight(){
  try{
    const height = document.documentElement.scrollHeight;
    window.parent.postMessage({ type:"resize", height }, "*");
  }catch(e){}
}
if(window.ResizeObserver){
  new ResizeObserver(reportHeight).observe(document.body);
}
window.addEventListener("load", reportHeight);

/* ===================== INIT ===================== */
loadGame();
updateXP();
updateMuseum();
startupSequence();
changeWeather();

</script>
