<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEI Mountain to Ocean - Hostinger Embed</title>
<style>
 /* Hostinger-safe: no 100dvh, no env(), no body touch-action:none */
  :root{--ink:#1a2744;--muted:#6d7189;--indigo:#4A6FA5;--indigo-deep:#2E4A7A;--water:#5BA3D9;--water-deep:#2E7BB8;--gold:#F5C542;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:transparent !important;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,#d6ebf8 0%,#eef7fc 100%);
    color:#3b3f57;
    display:block;
    padding:0;
  }
  .h-wrap{
    width:100%;
    max-width:420px;
    margin:0 auto;
    background:linear-gradient(180deg,#d6ebf8 0%,#eef7fc 100%);
    padding:12px 12px 18px;
    border-radius:18px;
  }
  .h-top{text-align:center;padding:6px 0 10px;}
  .h-eyebrow{font-family:ui-monospace,monospace;font-size:0.58rem;letter-spacing:0.14em;text-transform:uppercase;color:#2E4A7A;}
  .h-title{font-family:Georgia,serif;font-size:1.15rem;font-weight:800;color:#1a2744;line-height:1.2;margin-top:4px;}
  .h-sub{font-family:ui-monospace,monospace;font-size:0.6rem;color:#6d7189;margin-top:4px;}

  .diagram-frame{
    position:relative;
    width:100%;
    aspect-ratio:9/16;
    /* Hostinger iframe needs explicit min-height fallback */
    min-height:640px;
    background:#f7fbfe;
    border:3px solid #b8d4ea;
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 12px 32px rgba(46,74,122,0.16);
    touch-action:none; /* only this element blocks scroll, so swipe works */
    user-select:none;
    cursor:pointer;
    margin:0 auto;
  }
  svg.scene{width:100%;height:100%;display:block;}

  .caption-pill{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    font-family:Georgia,serif;font-weight:700;font-style:italic;
    color:#1a2744;background:rgba(255,255,255,0.97);
    border:2px solid #c5d8ea;padding:0.38em 0.95em;border-radius:40px;
    font-size:0.86rem;text-align:center;max-width:86%;white-space:nowrap;
    box-shadow:0 4px 14px rgba(26,39,68,0.10);pointer-events:none;z-index:7;
  }
  .streak-badge{
    position:absolute;top:50px;right:10px;z-index:7;
    font-family:ui-monospace,monospace;font-size:0.62rem;color:#fff;
    background:linear-gradient(120deg,#2E7BB8,#4A6FA5);padding:0.34em 0.68em;border-radius:18px;opacity:0;pointer-events:none;
  }
  .streak-badge.show{opacity:1;}
  .ites-badge{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:7;
    font-family:Georgia,serif;font-size:0.82rem;font-weight:700;color:#2E4A7A;
    background:#fff;border:2px solid #F5C542;padding:0.32em 0.85em;border-radius:24px;opacity:0;pointer-events:none;white-space:nowrap;
  }
  .ites-badge.show{opacity:1;}
  .system-banner{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(91,163,217,0.14),rgba(46,123,184,0.18));
    opacity:0;pointer-events:none;transition:opacity 0.4s;z-index:8;
  }
  .system-banner.show{opacity:1;}
  .system-banner .card{background:#fff;border:2px solid #c5d8ea;border-radius:14px;padding:0.9rem 1.2rem;text-align:center;max-width:82%;box-shadow:0 10px 26px rgba(26,39,68,0.14);}
  .system-banner .card h3{font-family:Georgia,serif;color:#1a2744;font-size:1.1rem;}

  .controls{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .steps-track{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
  .step-pill{font-family:ui-monospace,monospace;font-size:0.58rem;padding:0.38em 0.5em;border-radius:18px;border:1px solid #c5d8ea;background:#fff;color:#6d7189;text-align:center;}
  .step-pill.done{background:#eef6fc;color:#2E4A7A;border-color:#8ab4d8;}
  .step-pill.active{background:linear-gradient(120deg,#4A6FA5,#2E7BB8);color:#fff;border-color:#2E4A7A;}
  .btn-row{display:flex;gap:6px;}
  .btn-row button{flex:1;font-family:ui-monospace,monospace;font-size:0.72rem;font-weight:700;padding:0.7em;border-radius:10px;border:1px solid #2E4A7A;cursor:pointer;}
  button.primary{background:#2E4A7A;color:#fff;}
  button.secondary{background:#fff;color:#2E4A7A;}

  /* SVG essentials - simplified copy from main */
  .node{opacity:0.38;transition:opacity 0.4s;}.node.active{opacity:1;}.node.highlight{opacity:0.95;filter:drop-shadow(0 0 10px rgba(91,163,217,0.6));}
  .node-label{font-family:ui-monospace,monospace;font-size:10px;fill:#7a8a9e;text-transform:uppercase;letter-spacing:0.5px;}
  .node-label.active{fill:#2E4A7A;font-weight:800;}.node-label.reveal{fill:#c89a0a;font-weight:800;}
  .seg{fill:#d4e2ef;transition:fill 0.6s;}.seg.wet{fill:url(#riverGrad);}
  .flow{stroke:#fff;stroke-width:4.5;fill:none;stroke-dasharray:9 13;opacity:0;stroke-linecap:round;}.flow.on{opacity:0.9;animation:flowmove linear infinite;}
  #flow1.on{animation-duration:1.5s;}#flow2.on{animation-duration:1.25s;}#flow3.on{animation-duration:1.0s;}#flow4.on{animation-duration:0.85s;}#flow5.on{animation-duration:0.7s;}#flow6.on{animation-duration:0.55s;}
  .flow-foam{stroke:#eef8ff;stroke-width:2.1;fill:none;stroke-dasharray:4 8;opacity:0;stroke-linecap:round;}.flow-foam.on{opacity:0.85;animation:flowmove linear infinite;}
  @keyframes flowmove{to{stroke-dashoffset:-44;}}
  .flow-overlay{opacity:0;}.flow-overlay.on{opacity:0.95;}
  .wheel-spin{transform-origin:center;transform-box:fill-box;}.wheel-spin.spin{animation:spin 2.2s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}
  .drip,.glow{opacity:0;}.drip.on,.glow.on{opacity:1;}
  .ocean-fill{fill:#c5d8ea;}.ocean-fill.wet{fill:url(#oceanGrad);}
  .wave{opacity:0;}.wave.on{opacity:0.75;animation:waveDrift 3s ease-in-out infinite;}@keyframes waveDrift{0%,100%{transform:translateX(0);}50%{transform:translateX(5px);}}
  .splash-particle{animation:splashFly 0.7s ease-out forwards;}@keyframes splashFly{0%{transform:translate(0,0) scale(1);opacity:0.9;}100%{transform:translate(var(--dx),var(--dy)) scale(0.1);opacity:0;}}
  .ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.6),rgba(91,163,217,0.3) 60%,transparent 70%);pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:rippleGrow 0.6s ease-out forwards;z-index:5;}@keyframes rippleGrow{0%{transform:translate(-50%,-50%) scale(0);opacity:0.9;}100%{transform:translate(-50%,-50%) scale(1);opacity:0;}}
</style>
</head>
<body>

<script>
(function(){
  var NAMES={1:{physical:"Mountain",symbolic:"God"},2:{physical:"Dam",symbolic:"Heaven"},3:{physical:"Millpond",symbolic:"Earth"},4:{physical:"Sluice",symbolic:"2 Great Lights"},5:{physical:"Waterwheel",symbolic:"Great whales"},6:{physical:"Mill",symbolic:"Beast"}};
  var TOTAL=6,step=0,subTap=0,loopCount=1,emerged=false; var svgNS="http://www.w3.org/2000/svg";
  var caption=document.getElementById('captionPill'),nextBtn=document.getElementById('nextBtn'),resetBtn=document.getElementById('resetBtn');
  var banner=document.getElementById('systemBanner'),bannerTitle=document.getElementById('bannerTitle');
  var frame=document.getElementById('diagramFrame'),streakBadge=document.getElementById('streakBadge'),itesBadge=document.getElementById('itesBadge');
  var pills=document.querySelectorAll('.step-pill'),svg=document.querySelector('svg.scene'),gravityLayer=document.getElementById('gravityLayer');

  function on(id,cls,s){var e=document.getElementById(id);if(e)e.classList.toggle(cls,s);}
  function setLabel(n,mode){var m={1:'lbl-mountain',2:'lbl-dam',3:'lbl-millpond',4:'lbl-sluice',5:'lbl-wheel',6:'lbl-mill'};var el=document.getElementById(m[n]);if(!el)return;el.classList.remove('active','reveal');if(mode==='reveal'){el.textContent=n+' · '+NAMES[n].symbolic;el.classList.add('reveal');}else if(mode==='active'){el.textContent=n+' · '+NAMES[n].symbolic;el.classList.add('active');}else{el.textContent=n+' · '+NAMES[n].physical;}}
  function spawnSplash(cx,cy,c){c=c||6;for(var i=0;i<c;i++){var cc=document.createElementNS(svgNS,'circle');var ang=(Math.random()*Math.PI*1.6)-Math.PI*0.8;var dist=10+Math.random()*18;var dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist+6;cc.setAttribute('cx',cx);cc.setAttribute('cy',cy);cc.setAttribute('r',2+Math.random()*2);cc.setAttribute('class','splash-particle');cc.style.setProperty('--dx',dx+'px');cc.style.setProperty('--dy',dy+'px');cc.style.fill=Math.random()>0.5?'#a8d4f0':'#2E7BB8';svg.appendChild(cc);(function(el){setTimeout(function(){el.remove();},700);})(cc);}}
  function spawnRipple(x,y){var r=frame.getBoundingClientRect(),d=document.createElement('div');d.className='ripple';var s=Math.max(r.width,r.height)*0.3;d.style.width=s+'px';d.style.height=s+'px';d.style.left=(x-r.left)+'px';d.style.top=(y-r.top)+'px';frame.appendChild(d);setTimeout(function(){d.remove();},600);}

  /* Gravity */
  var drops=[],G=2100;
  function launchDrop(o){var from=o.fromY||26,to=o.toY||122,x=o.x||190,vy0=o.vy0||0,size=o.size||5.5,ay=o.ay||G;var g=document.createElementNS(svgNS,'g');g.setAttribute('transform','translate('+x+','+from+')');var tail=document.createElementNS(svgNS,'ellipse');tail.setAttribute('cx',0);tail.setAttribute('cy',size);tail.setAttribute('rx',size*0.5);tail.setAttribute('ry',size);tail.setAttribute('fill','#5BA3D9');tail.setAttribute('opacity','0.5');var core=document.createElementNS(svgNS,'circle');core.setAttribute('r',size);core.setAttribute('fill','url(#dropGrad)');g.appendChild(tail);g.appendChild(core);gravityLayer.appendChild(g);drops.push({g:g,tail:tail,x:x,y:from,vy:vy0,ay:ay,toY:to,cx:x,cy:to,size:size});}
  function launchForStep(n,vel){var p={1:{from:26,to:122},2:{from:164,to:230},3:{from:230,to:312},4:{from:314,to:390},5:{from:390,to:500},6:{from:500,to:628}}[n]||{from:26,to:122};var v=vel||0;var s=5.5+v/700;launchDrop({fromY:p.from,toY:p.to,x:190,vy0:v*0.35,size:s});}
  var last=performance.now();(function loop(now){var dt=Math.min(0.05,(now-last)/1000);last=now;for(var i=drops.length-1;i>=0;i--){var d=drops[i];d.vy+=d.ay*dt;d.y+=d.vy*dt;d.tail.setAttribute('ry',d.size*(1+d.vy/600));d.g.setAttribute('transform','translate('+d.x+','+d.y+')');if(d.y>=d.toY){spawnSplash(d.cx,d.cy,5);d.g.remove();drops.splice(i,1);}}requestAnimationFrame(loop);})(last);

  function render(){
    on('node-mountain','active',step>1||(step===1&&subTap===3)||emerged);
    on('node-dam','active',step>2||(step===2&&subTap===3)||emerged);
    on('node-millpond','active',step>3||(step===3&&subTap===3)||emerged);
    on('node-sluice','active',step>4||(step===4&&subTap===3)||emerged);
    on('node-wheel','active',step>5||(step===5&&subTap===3)||emerged);
    on('node-mill-inner','active',step>6||(step===6&&subTap===3)||emerged);
    ['node-mountain','node-dam','node-millpond','node-sluice','node-wheel','node-mill-inner'].forEach(function(id){on(id,'highlight',false);});
    if(subTap===1&&step>=1){var map={1:'node-mountain',2:'node-dam',3:'node-millpond',4:'node-sluice',5:'node-wheel',6:'node-mill-inner'};on(map[step],'highlight',true);}
    for(var s=1;s<=6;s++){if(s<step||(s===step&&subTap===3)||emerged)setLabel(s,'active');else if(s===step&&subTap===2)setLabel(s,'reveal');else setLabel(s,'physical');}
    on('dam-churn','on',step>2||(step===2&&subTap===3));on('pond-ripple1','on',step>3||(step===3&&subTap===3));on('sluice-arrow','on',step>4||(step===4&&subTap===3));on('glow-mill','on',step>6||(step===6&&subTap===3));
    var wheel=step>5||(step===5&&subTap===3)||emerged;['wheel-group','gear-large'].forEach(function(id){var g=document.getElementById(id);if(g)g.classList.toggle('spin',wheel);});
    on('seg1','wet',step>1||(step===1&&subTap===3)||emerged);on('seg2','wet',step>2||(step===2&&subTap===3)||emerged);on('seg3','wet',step>3||(step===3&&subTap===3)||emerged);on('seg4','wet',step>4||(step===4&&subTap===3)||emerged);on('seg5','wet',step>5||(step===5&&subTap===3)||emerged);on('seg6','wet',step>6||(step===6&&subTap===3)||emerged);
    on('flow1','on',step>1||(step===1&&subTap===3)||emerged);on('ov1','on',step>1||(step===1&&subTap===3)||emerged);on('foam1','on',step>1||(step===1&&subTap===3)||emerged);
    on('flow2','on',step>2||(step===2&&subTap===3)||emerged);on('ov2','on',step>2||(step===2&&subTap===3)||emerged);on('foam2','on',step>2||(step===2&&subTap===3)||emerged);
    on('flow3','on',step>3||(step===3&&subTap===3)||emerged);on('ov3','on',step>3||(step===3&&subTap===3)||emerged);on('foam3','on',step>3||(step===3&&subTap===3)||emerged);
    on('flow4','on',step>4||(step===4&&subTap===3)||emerged);on('ov4','on',step>4||(step===4&&subTap===3)||emerged);on('foam4','on',step>4||(step===4&&subTap===3)||emerged);
    on('flow5','on',step>5||(step===5&&subTap===3)||emerged);on('ov5','on',step>5||(step===5&&subTap===3)||emerged);on('foam5','on',step>5||(step===5&&subTap===3)||emerged);
    on('flow6','on',step>6||(step===6&&subTap===3)||emerged);on('ov6','on',step>6||(step===6&&subTap===3)||emerged);on('foam6','on',step>6||(step===6&&subTap===3)||emerged);
    on('oceanRect','wet',step>6||(step===6&&subTap===3)||emerged);on('wave1','on',step>6||(step===6&&subTap===3));
    pills.forEach(function(p){var n=+p.getAttribute('data-step');p.classList.remove('active','done');if(n<step||(n===step&&subTap===3)||emerged)p.classList.add('done');if(n===step&&subTap>0&&subTap<3)p.classList.add('active');});
    caption.textContent=step===0?"Tap / Swipe ↓ to start":(step? (subTap===1?"Highlight "+NAMES[step].physical: subTap===2? NAMES[step].physical+" = "+NAMES[step].symbolic : "Water falls to next"):"");
    banner.classList.toggle('show',step===6&&subTap===3);
    streakBadge.textContent='Loop '+loopCount;streakBadge.classList.toggle('show',loopCount>1||(step===6&&subTap===3));
    itesBadge.textContent=["Israelites 🌊","Jacobites 🌊","Adamites 🌊"][ (loopCount-1)%3 ]; itesBadge.classList.toggle('show',loopCount>1);
  }

  function advance(vel){
    if(step===0){step=1;subTap=1;launchForStep(1,vel||0);render();return;}
    if(step===6&&subTap===3){loopCount++;step=1;subTap=1;emerged=true;launchForStep(1,800);render();return;}
    if(subTap<3){subTap++;if(subTap===3){launchForStep(step,vel||400);spawnSplash(190,[88,210,268,400,466,570][step-1],7);} } else {step++;subTap=1;}
    render();
  }

  var sY=0,sX=0,sT=0,swiping=false,active=false;
  frame.addEventListener('pointerdown',function(e){sY=e.clientY;sX=e.clientX;sT=performance.now();swiping=false;active=true;frame.setPointerCapture(e.pointerId);});
  frame.addEventListener('pointermove',function(e){if(!active)return;var dy=e.clientY-sY,dx=e.clientX-sX;if(!swiping&&Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.2){swiping=true;}if(swiping){e.preventDefault();}});
  frame.addEventListener('pointerup',function(e){if(!active)return;active=false;var dy=e.clientY-sY,dx=e.clientX-sX,dt=performance.now()-sT;if(swiping&&dy>50&&dy>Math.abs(dx)*1.2){var vel=dt>0? dy/dt*1000:600;spawnRipple(e.clientX,e.clientY);advance(vel);}else if(!swiping&&Math.abs(dy)<12&&Math.abs(dx)<12){spawnRipple(e.clientX,e.clientY);advance(0);}swiping=false;});
  nextBtn.addEventListener('click',function(e){e.stopPropagation();advance(0);});
  resetBtn.addEventListener('click',function(e){e.stopPropagation();step=0;subTap=0;emerged=false;loopCount=1;drops.forEach(function(d){d.g.remove();});drops=[];['seg1','seg2','seg3','seg4','seg5','seg6'].forEach(function(id){on(id,'wet',false);});['flow1','flow2','flow3','flow4','flow5','flow6','foam1','foam2','foam3','foam4','foam5','foam6','ov1','ov2','ov3','ov4','ov5','ov6','wave1','dam-churn','pond-ripple1','sluice-arrow','glow-mill'].forEach(function(id){on(id,'on',false);});render();});
  frame.addEventListener('click',function(e){spawnRipple(e.clientX,e.clientY);advance(0);});
  render();
})();
