<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>GEI Ultimate Edition 2.1 | YALLTOO</title>

<meta name="description" content="Genesis Engineered Interpretations Ultimate Edition. An interactive hydraulic journey from Mountain to Ocean through Reservoir, Dam, Millpond, Sluice Gate, Waterwheel and Mill.">

<style>

:root{

--cyan:#2fd2ff;
--indigo:#3d3dea;
--magenta:#f310ba;
--pink:#ff9df2;
--black:#06070d;

--glass:
rgba(255,255,255,.10);

--glassBorder:
rgba(255,255,255,.15);

--panel:
rgba(8,14,24,.75);

--water:
#2fd2ff;

--waterGlow:
rgba(47,210,255,.55);

--radius:22px;

font-family:
Inter,
system-ui,
sans-serif;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,
body{

height:100%;
overflow:hidden;

background:

radial-gradient(
circle at top,
#18284a,
#06070d
);

color:white;

font-family:
Inter,
system-ui,
sans-serif;

}

body{

display:flex;
justify-content:center;
align-items:center;

}

/* ----------------------- */
/* BACKGROUND FX */
/* ----------------------- */

.bg{

position:fixed;
inset:0;
overflow:hidden;
pointer-events:none;

}

.bgGlow{

position:absolute;

width:600px;
height:600px;

border-radius:50%;

background:

radial-gradient(
circle,
rgba(47,210,255,.12),
transparent 70%
);

animation:
floatGlow 20s linear infinite;

}

.bgGlow:nth-child(2){

right:-100px;
bottom:-100px;

animation-duration:30s;

}

@keyframes floatGlow{

0%{
transform:
translateY(0px);
}

50%{
transform:
translateY(-60px);
}

100%{
transform:
translateY(0px);
}

}

/* ----------------------- */
/* APP */
/* ----------------------- */

.app{

position:relative;

width:100%;
max-width:520px;

height:100dvh;

display:flex;
flex-direction:column;

padding:
env(safe-area-inset-top)
12px
env(safe-area-inset-bottom);

z-index:2;

}

/* ----------------------- */
/* HUD */
/* ----------------------- */

.hud{

background:
var(--panel);

border:
1px solid var(--glassBorder);

backdrop-filter:
blur(16px);

border-radius:
var(--radius);

padding:12px;

margin-bottom:10px;

}

.logo{

font-size:1.15rem;
font-weight:900;

background:

linear-gradient(
90deg,
var(--cyan),
var(--pink),
var(--magenta)
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.stats{

display:flex;
justify-content:space-between;

margin-top:10px;

font-size:.8rem;

}

.stat{

padding:6px 10px;

background:
rgba(255,255,255,.05);

border-radius:999px;

}

/* ----------------------- */
/* WORLD */
/* ----------------------- */

.world{

position:relative;

flex:1;

overflow:hidden;

border-radius:
var(--radius);

background:

linear-gradient(
180deg,
#dff6ff,
#cfefff
);

border:
1px solid rgba(255,255,255,.15);

box-shadow:

0 0 40px rgba(47,210,255,.15);

}

/* ----------------------- */
/* SVG */
/* ----------------------- */

svg{

width:100%;
height:100%;

display:block;

}

/* ----------------------- */
/* HOTSPOTS */
/* ----------------------- */

.hotspot{

cursor:pointer;

transition:.25s;

}

.hotspot:hover{

filter:
brightness(1.1);

}

/* ----------------------- */
/* PROGRESS */
/* ----------------------- */

.progressWrap{

margin-top:10px;

height:10px;

background:
rgba(255,255,255,.08);

border-radius:999px;

overflow:hidden;

}

.progressFill{

width:0%;

height:100%;

background:

linear-gradient(
90deg,
var(--cyan),
var(--magenta)
);

box-shadow:

0 0 20px var(--waterGlow);

transition:
width .6s ease;

}

/* ----------------------- */
/* OVERLAY */
/* ----------------------- */

.overlay{

position:absolute;

left:10px;
right:10px;
bottom:10px;

background:

rgba(255,255,255,.96);

color:#111;

border-radius:
20px;

padding:18px;

z-index:50;

transform:
translateY(130%);

transition:
.45s ease;

box-shadow:
0 20px 50px rgba(0,0,0,.25);

}

.overlay.show{

transform:
translateY(0);

}

.overlayDay{

font-size:1.1rem;
font-weight:900;

color:
var(--indigo);

margin-bottom:10px;

}

.overlaySection{

margin-top:10px;

}

.overlayLabel{

font-weight:800;

margin-bottom:4px;

}

.closeOverlay{

position:absolute;

right:12px;
top:10px;

cursor:pointer;

font-size:1.3rem;

}

/* ----------------------- */
/* CONTROL BAR */
/* ----------------------- */

.controls{

display:flex;
gap:10px;

margin-top:10px;

}

.btn{

flex:1;

border:none;

padding:14px;

border-radius:16px;

font-weight:800;

color:white;

background:

linear-gradient(
135deg,
var(--indigo),
var(--magenta)
);

cursor:pointer;

}

.btn:active{

transform:
scale(.96);

}

/* ----------------------- */
/* DAY LABELS */
/* ----------------------- */

.nodeLabel{

font-size:12px;
font-weight:800;
fill:#1d2742;

pointer-events:none;

}

/* ----------------------- */
/* WATER SHIMMER */
/* ----------------------- */

.waterShimmer{

position:absolute;
inset:0;

background:

linear-gradient(
120deg,
transparent,
rgba(255,255,255,.15),
transparent
);

animation:
shimmer 7s linear infinite;

pointer-events:none;

}

@keyframes shimmer{

0%{
transform:translateX(-150%);
}

100%{
transform:translateX(150%);
}

}

</style>
</head>
<body>

<div class="bg">

<div class="bgGlow"></div>
<div class="bgGlow"></div>

</div>

<div class="app">

<div class="hud">

<div class="logo">
GEI Ultimate Edition 2.1
</div>

<div class="stats">

<div class="stat">
Day Progress:
<span id="progressText">
0/6
</span>
</div>

<div class="stat">

</span>
</div>

<div class="stat">

<span id="wheelText">

</span>
</div>

</div>

<div class="progressWrap">
<div
class="progressFill"
id="progressFill">
</div>
</div>

</div>

<div class="world">

<div class="waterShimmer"></div>

<svg
viewBox="0 0 400 800">

<!-- FLOW PATH -->

<!-- MILL -->

<rect

"

</svg>

<!-- DAY OVERLAY -->

<div
class="overlay"
id="overlay">

<div
class="closeOverlay"
id="closeOverlay">
✕
</div>

<div
class="overlayDay"
id="overlayDay">
DAY 1
</div>

<div class="overlaySection">

<div class="overlayLabel">
Genesis
</div>

<div id="overlayGenesis">
Let there be light.
</div>

</div>

<div class="overlaySection">

<div class="overlayLabel">
GEI
</div>

<div id="overlayGEI">
Released water.
</div>

</div>

<div class="overlaySection">

<div class="overlayLabel">
Engineering
</div>

<div id="overlayEngineering">
Potential energy becomes motion.
</div>

</div>

<div class="overlaySection">

<div class="overlayLabel">
Modern Example
</div>

<div id="overlayModern">
Reservoir release systems.
</div>

</div>

</div>

</div>

<!-- CONTROLS -->

<div class="controls">

<button
class="btn"
id="fillBtn">

FILL

</button>

<button
class="btn"
id="gateBtn">

OPEN GATE

</button>

<button
class="btn"
id="resetBtn">

RESET

</button>

</div>

</div>

<script>

/* ------------------ */
/* GEI DATA MODEL */
/* ------------------ */

const DAY_DATA = {

1:{
title:"DAY 1",
genesis:"Let there be light.",
gei:"Released water.",
engineering:"Potential energy becomes motion.",
modern:"Controlled release from storage."
},

2:{
title:"DAY 2",
genesis:"Firmament.",
gei:"Dam structure.",
engineering:"Containment and regulation.",
modern:"Concrete dams."
},

3:{
title:"DAY 3",
genesis:"Gathering together.",
gei:"Reservoir and millpond.",
engineering:"Storage systems.",
modern:"Water retention basins."
},

4:{
title:"DAY 4",
genesis:"Two Great Lights.",
gei:"Flow regulators.",
engineering:"Control systems.",
modern:"Sluice gates."
},

5:{
title:"DAY 5",
genesis:"Great Whales.",
gei:"Waterwheel system.",
engineering:"Mechanical conversion.",
modern:"Hydroelectric turbines."
},

6:{
title:"DAY 6",
genesis:"Beast System.",
gei:"Integrated hydraulic operation.",
engineering:"System management.",
modern:"Modern water infrastructure."
}

};

/* ------------------ */
/* OVERLAY REFERENCES */
/* ------------------ */

const overlay =
document.getElementById(
"overlay"
);

const overlayDay =
document.getElementById(
"overlayDay"
);

const overlayGenesis =
document.getElementById(
"overlayGenesis"
);

const overlayGEI =
document.getElementById(
"overlayGEI"
);

const overlayEngineering =
document.getElementById(
"overlayEngineering"
);

const overlayModern =
document.getElementById(
"overlayModern"
);

document
.getElementById(
"closeOverlay"
)
.addEventListener(
"click",
()=>{
overlay.classList.remove(
"show"
);
}
);

/* ------------------ */
/* DISCOVERY SYSTEM */
/* ------------------ */

const discovered =
new Set();

const progressFill =
document.getElementById(
"progressFill"
);

const progressText =
document.getElementById(
"progressText"
);

function updateProgress(){

const count =
discovered.size;

progressText.textContent =
count + "/6";

progressFill.style.width =
(count / 6 * 100) + "%";

}

/* ------------------ */
/* HOTSPOT EVENTS */
/* ------------------ */

document
.querySelectorAll(
".hotspot"
)
.forEach(node=>{

node.addEventListener(
"click",
()=>{

const day =
Number(
node.dataset.day
);

if(day > 0){

discovered.add(day);

updateProgress();

const data =
DAY_DATA[day];

overlayDay.textContent =
data.title;

overlayGenesis.textContent =
data.genesis;

overlayGEI.textContent =
data.gei;

overlayEngineering.textContent =
data.engineering;

overlayModern.textContent =
data.modern;

overlay.classList.add(
"show"
);

}

}
);

});

/* ------------------ */
/* GEI ENGINE STATE */
/* ------------------ */

const GEI = {

reservoirLevel:100,

pressure:1,

flowRate:0,

gatePosition:0,

wheelSpeed:0,

wheelAngle:0,

oceanLevel:0,

dayProgress:0

};
/* ------------------ */
/* UI REFERENCES */
/* ------------------ */

const reservoirText =
document.getElementById(
"reservoirText"
);

const wheelText =
document.getElementById(
"wheelText"
);

const wheelGroup =
document.getElementById(
"wheelGroup"
);

const gateVisual =
document.getElementById(
"gateVisual"
);

const riverPath =
document.getElementById(
"riverPath"
);

const oceanWave =
document.getElementById(
"oceanWave"
);

/* ------------------ */
/* BUTTONS */
/* ------------------ */

document
.getElementById("fillBtn")
.addEventListener(
"click",
()=>{

GEI.reservoirLevel =
Math.min(
100,
GEI.reservoirLevel + 15
);

saveGame();

}
);

document
.getElementById("gateBtn")
.addEventListener(
"click",
()=>{

GEI.gatePosition =
GEI.gatePosition === 0
? 1
: 0;

document
.getElementById(
"gateBtn"
)
textContent =
GEI.gatePosition
? "CLOSE GATE"
: "OPEN GATE";

saveGame();

}
);

document
.getElementById("resetBtn")
.addEventListener(
"click",
()=>{

localStorage.removeItem(
"GEI_ULTIMATE_SAVE"
);

location.reload();

}
);

/* ------------------ */
/* SAVE SYSTEM */
/* ------------------ */

function saveGame(){

const data = {

reservoirLevel:
GEI.reservoirLevel,

gatePosition:
GEI.gatePosition,

discovered:
[...discovered]

};

localStorage.setItem(
"GEI_ULTIMATE_SAVE",
JSON.stringify(data)
);

}

function loadGame(){

const save =
localStorage.getItem(
"GEI_ULTIMATE_SAVE"
);

if(!save) return;

try{

const data =
JSON.parse(save);

GEI.reservoirLevel =
data.reservoirLevel ?? 100;

GEI.gatePosition =
data.gatePosition ?? 0;

if(
Array.isArray(
data.discovered
)
){

data.discovered.forEach(
d=>discovered.add(d)
);

updateProgress();

}

}catch(err){

console.log(err);

}

}

/* ------------------ */
/* PHYSICS ENGINE */
/* ------------------ */

function updatePhysics(){

GEI.pressure =
GEI.reservoirLevel * 0.01;

GEI.flowRate =
GEI.pressure *
GEI.gatePosition;

if(
GEI.gatePosition > 0
){

GEI.reservoirLevel -=
GEI.flowRate * 0.03;

}

GEI.reservoirLevel =
Math.max(
0,
GEI.reservoirLevel
);

GEI.wheelSpeed +=
GEI.flowRate * 0.12;

GEI.wheelSpeed *=
0.987;

GEI.wheelAngle +=
GEI.wheelSpeed;

GEI.oceanLevel +=
GEI.flowRate * 0.01;

GEI.oceanLevel =
Math.min(
100,
GEI.oceanLevel
);

}

/* ------------------ */
/* HUD */
/* ------------------ */

function updateHUD(){

reservoirText.textContent =
Math.round(
GEI.reservoirLevel
) + "%";

wheelText.textContent =
Math.round(
GEI.wheelSpeed * 60
);

}

/* ------------------ */
/* WHEEL RENDER */
/* ------------------ */

function updateWheel(){

wheelGroup.setAttribute(

"transform",

`rotate(
${GEI.wheelAngle}
200
620
)`

);

}

/* ------------------ */
/* GATE RENDER */
/* ------------------ */

function updateGate(){

const x =
GEI.gatePosition
? 220
: 185;

gateVisual.setAttribute(
"x",
x
);

}

/* ------------------ */
/* FLOWING WATER */
/* ------------------ */

let dashOffset = 0;

function updateRiver(){

dashOffset -=
2 + GEI.flowRate * 4;

riverPath.style.strokeDasharray =
"30 18";

riverPath.style.strokeDashoffset =
dashOffset;

riverPath.style.filter =
"drop-shadow(0 0 8px #2fd2ff)";

}

/* ------------------ */
/* OCEAN ENGINE */
/* ------------------ */

let waveTime = 0;

function updateOcean(){

waveTime += 0.03;

const y1 =
770 +
Math.sin(waveTime)*6;

const y2 =
770 +
Math.cos(waveTime)*6;

const y3 =
770 +
Math.sin(
waveTime + 2
)*6;

const y4 =
770 +
Math.cos(
waveTime + 3
)*6;

oceanWave.setAttribute(

"d",

`
M0 ${y1}
Q40 ${y2}
80 ${y1}

Q120 ${y3}
160 ${y2}

Q200 ${y1}
240 ${y3}

Q280 ${y2}
320 ${y4}

Q360 ${y1}
400 ${y2}

L400 800
L0 800
Z
`

);

}

/* ------------------ */
/* OCEAN UNLOCK */
/* ------------------ */

let celebrationShown =
false;

function checkCompletion(){

if(
discovered.size === 6 &&
!celebrationShown
){

celebrationShown = true;

overlayDay.textContent =
"JOURNEY COMPLETE";

overlayGenesis.textContent =
"Mountain → Ocean";

overlayGEI.textContent =
"All six GEI stages explored.";

overlayEngineering.textContent =
"Hydraulic system completed.";

overlayModern.textContent =
"Ocean unlocked.";

overlay.classList.add(
"show"
);

worldPulse();

}

}

function worldPulse(){

document
.querySelector(
".world"
)
.animate(

[
{
boxShadow:
"0 0 20px rgba(47,210,255,.2)"
},
{
boxShadow:
"0 0 60px rgba(243,16,186,.8)"
},
{
boxShadow:
"0 0 20px rgba(47,210,255,.2)"
}
],

{
duration:2500
}

);

}

/* ------------------ */
/* LIGHT AUDIO */
/* ------------------ */

const AudioContextClass =
window.AudioContext ||
window.webkitAudioContext;

let audioCtx = null;

function beep(freq){

try{

if(!audioCtx){

audioCtx =
new AudioContextClass();

}

const osc =
audioCtx.createOscillator();

const gain =
audioCtx.createGain();

osc.frequency.value =
freq;

gain.gain.value =
0.03;

osc.connect(gain);

gain.connect(
audioCtx.destination
);

osc.start();

gain.gain.exponentialRampToValueAtTime(
0.0001,
audioCtx.currentTime + 0.15
);

osc.stop(
audioCtx.currentTime + 0.15
);

}catch(e){}

}

document
.querySelectorAll(".hotspot")
.forEach(h=>{

h.addEventListener(
"click",
()=>{

beep(
300 +
Math.random()*400
);

saveGame();

}
);

});

/* ------------------ */
/* MAIN LOOP */
/* ------------------ */

function animate(){

updatePhysics();

updateHUD();

updateWheel();

updateGate();

updateRiver();

updateOcean();

checkCompletion();

requestAnimationFrame(
animate
);

}

/* ------------------ */
/* INITIALIZATION */
/* ------------------ */

loadGame();

updateHUD();

updateProgress();

animate();

</script>

</body>
</html>
