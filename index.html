<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>GEI Infinite Flow | YALLTOO</title>
<meta name="description" content="Tap your way through the GEI hydraulic system — Mountain to Ocean — and watch a new tribe name reveal itself every loop.">
<style>

:root{
  /* water palette (dominant) */
  --water-deep:#03203f;
  --water-mid:#0b4d7a;
  --water-bright:#2fd2ff;
  --foam:#eafcff;

  /* yalltoo brand accents (used lightly) */
  --yt-indigo:#6C74E8;
  --yt-pink:#EE8DF5;
  --yt-cyan:#2fd2ff;

  --gold:#ffd76a;
  --panel:rgba(4,12,24,.88);
  --glassBorder:rgba(255,255,255,.14);
  --radius:22px;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,sans-serif;
  background:radial-gradient(circle at 50% 0%,#0d2c52,#030a16 75%);
  color:#fff;
  -webkit-tap-highlight-color:transparent;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

.bg{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.bgGlow{
  position:absolute; width:clamp(280px,80vw,640px); height:clamp(280px,80vw,640px);
  border-radius:50%;
  background:radial-gradient(circle, rgba(47,210,255,.16), transparent 70%);
  animation:floatGlow 24s ease-in-out infinite;
}
.bgGlow:nth-child(2){
  right:-180px; bottom:-100px;
  background:radial-gradient(circle, rgba(238,141,245,.12), transparent 70%);
  animation-duration:32s;
}
@keyframes floatGlow{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-50px);} }

.app{
  position:relative;
  width:100%; max-width:520px; height:100dvh;
  margin:auto; display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
  z-index:5;
}

/* ============ HUD ============ */
.hud{
  background:var(--panel);
  backdrop-filter:blur(18px);
  border:1px solid var(--glassBorder);
  border-radius:var(--radius);
  padding:10px 12px;
  margin-bottom:8px;
  flex-shrink:0;
}
.hudTop{ display:flex; justify-content:space-between; align-items:center; gap:8px; }

.logo{
  font-size:clamp(.9rem,4vw,1.1rem);
  font-weight:900;
  background:linear-gradient(90deg,var(--yt-cyan),var(--yt-pink),var(--yt-indigo));
  background-size:200% auto;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  animation:hueSlide 7s linear infinite;
}
@keyframes hueSlide{ to{ background-position:200% center; } }

.hudRight{ display:flex; gap:6px; }
.iconBtn{
  width:36px; height:36px; border-radius:11px;
  border:1px solid var(--glassBorder);
  background:rgba(255,255,255,.08);
  color:#fff; font-size:.95rem;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.iconBtn:active{ transform:scale(.92); }

.progressRow{ display:flex; align-items:center; gap:6px; margin-top:10px; }
.dot{
  flex:1; height:8px; border-radius:999px;
  background:rgba(255,255,255,.1);
  overflow:hidden;
}
.dot i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,var(--yt-cyan),var(--foam));
  transition:width .5s ease;
}
.loopBadge{
  font-size:.68rem; font-weight:800; color:rgba(255,255,255,.7);
  white-space:nowrap; padding-left:2px;
}
.loopBadge strong{ color:var(--gold); }

/* ============ WORLD ============ */
.world{
  position:relative; flex:1; overflow:hidden;
  border-radius:24px;
  background:linear-gradient(180deg,var(--water-deep),#02060f 60%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 0 40px rgba(47,210,255,.16), inset 0 0 60px rgba(0,0,0,.4);
  touch-action:manipulation;
}
.layer{ position:absolute; inset:0; pointer-events:none; }
#mistLayer{ z-index:3; }
#particleLayer{ z-index:9; }
svg{ width:100%; height:100%; display:block; position:relative; z-index:5; }

/* ============ STATIONS ============ */
.station{ cursor:pointer; }
.station .track{ opacity:1; }

.station .body{ transition:opacity .4s, filter .4s; }
.station.locked .body{ opacity:.28; filter:grayscale(.8) brightness(.6); }
.station.locked{ cursor:default; }

.station.active .body{ opacity:1; }
.station .ring{ opacity:0; transition:opacity .3s; }
.station.active .ring{ opacity:.55; animation:ringPulse 1.6s ease-in-out infinite; }
@keyframes ringPulse{ 0%,100%{ opacity:.35; transform:scale(1);} 50%{ opacity:.75; transform:scale(1.05);} }

.station.done .body{ opacity:1; filter:none; }
.station.done .checkmark{ opacity:1; }
.checkmark{ opacity:0; transition:opacity .3s; }

.station.highlight .body{ filter:drop-shadow(0 0 14px var(--water-bright)); }

.station.tapped{ animation:tapPop .25s ease; }
@keyframes tapPop{ 0%{transform:scale(1);} 45%{transform:scale(1.1);} 100%{transform:scale(1);} }

.station .nameLabel{
  opacity:0; transform:translateY(4px);
  transition:opacity .3s, transform .3s;
}
.station.showName .nameLabel{ opacity:1; transform:translateY(0); }

/* ============ SEGMENTS ============ */
.segTrack{ stroke:rgba(255,255,255,.1); stroke-width:10; stroke-linecap:round; fill:none; }
.segFlow{
  stroke:url(#flowGradient); stroke-width:10; stroke-linecap:round; fill:none;
  stroke-dasharray:100; stroke-dashoffset:100;
  filter:url(#waterGlow);
  transition:stroke-dashoffset 1s ease;
}

/* ============ OCEAN ============ */
#oceanGroup .oceanFill{ transition:opacity .6s; opacity:.55; }
#oceanGroup.reached .oceanFill{ opacity:1; }
#oceanGroup.reached{ filter:drop-shadow(0 0 20px var(--water-bright)); }

/* ============ TOASTS ============ */
.labelToast{
  position:absolute; top:10px; left:50%;
  transform:translate(-50%,-14px);
  padding:8px 16px; border-radius:999px;
  background:rgba(4,12,24,.9);
  border:1px solid var(--glassBorder);
  font-weight:800; font-size:.82rem;
  white-space:nowrap; opacity:0; pointer-events:none;
  transition:opacity .25s, transform .25s;
  z-index:40; box-shadow:0 0 20px rgba(47,210,255,.25);
  max-width:88%; text-align:center;
}
.labelToast.show{ opacity:1; transform:translate(-50%,0); }

/* ============ TRIBE REVEAL CARD ============ */
.tribeCard{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(2,6,14,.72);
  backdrop-filter:blur(6px);
  opacity:0; pointer-events:none;
  transition:opacity .35s;
  z-index:95;
}
.tribeCard.show{ opacity:1; pointer-events:auto; }
.tribeInner{
  background:linear-gradient(160deg, rgba(108,116,232,.25), rgba(238,141,245,.18));
  border:1px solid rgba(255,255,255,.25);
  border-radius:24px;
  padding:26px 22px;
  text-align:center;
  max-width:84%;
  transform:scale(.85);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 0 40px rgba(47,210,255,.35);
}
.tribeCard.show .tribeInner{ transform:scale(1); }
.tribeEyebrow{ font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.65); font-weight:700; }
.tribeName{
  font-size:clamp(1.5rem,7vw,2.1rem);
  font-weight:900;
  margin:8px 0 6px;
  background:linear-gradient(90deg,var(--yt-cyan),var(--gold),var(--yt-pink));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.tribeSub{ font-size:.78rem; color:rgba(255,255,255,.75); }

/* ============ TRIBES PANEL ============ */
.sidePanel{
  position:absolute; top:0; right:-100%;
  width:82%; height:100%;
  background:rgba(4,10,20,.96);
  backdrop-filter:blur(20px);
  z-index:90; padding:20px;
  transition:.4s; overflow:auto;
}
.sidePanel.open{ right:0; }
.panelTitle{ font-size:1.15rem; font-weight:900; margin-bottom:16px; }
.tribeItem{
  padding:11px 14px; margin-bottom:8px; border-radius:12px;
  background:rgba(255,255,255,.06);
  font-weight:700; font-size:.85rem;
  border-left:3px solid var(--yt-cyan);
}
.emptyNote{ font-size:.8rem; color:rgba(255,255,255,.55); line-height:1.5; }

.flash{ animation:flashPop .4s ease; }
@keyframes flashPop{
  0%{ box-shadow:inset 0 0 0 0 rgba(47,210,255,0); }
  40%{ box-shadow:inset 0 0 90px 12px rgba(47,210,255,.45); }
  100%{ box-shadow:inset 0 0 0 0 rgba(47,210,255,0); }
}

.foam{
  position:absolute; width:7px; height:7px; border-radius:50%;
  background:var(--foam);
  animation:foamPop 1.6s ease-out forwards;
}
@keyframes foamPop{
  0%{ opacity:.9; transform:scale(1) translateY(0); }
  100%{ opacity:0; transform:scale(.3) translateY(-16px); }
}

.app:fullscreen, .app:-webkit-full-screen{ max-width:100%; background:#03060f; }

</style>
</head>
<body>

<div class="bg"><div class="bgGlow"></div><div class="bgGlow"></div></div>

<div class="app" id="appRoot">

  <div class="hud">
    <div class="hudTop">
      <div class="logo">GEI Infinite Flow</div>
      <div class="hudRight">
        <button class="iconBtn" id="fullscreenBtn" aria-label="Toggle fullscreen">⛶</button>
        <button class="iconBtn" id="tribesBtn" aria-label="Tribes discovered">📜</button>
      </div>
    </div>
    <div class="progressRow" id="progressRow"></div>
    <div class="loopBadge">Loop <strong id="loopCount">0</strong> — tap the glowing station</div>
  </div>

  <div class="world" id="world">
    <div class="layer" id="mistLayer"></div>
    <div class="layer" id="particleLayer"></div>

    <div class="labelToast" id="labelToast"></div>

    <svg id="worldSVG" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0d2c52"/>
          <stop offset="55%" stop-color="#0b4d7a"/>
          <stop offset="100%" stop-color="#04121f"/>
        </linearGradient>
        <linearGradient id="flowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#2fd2ff"/>
          <stop offset="50%" stop-color="#eafcff"/>
          <stop offset="100%" stop-color="#6C74E8"/>
        </linearGradient>
        <filter id="waterGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="neonGlow" x="-70%" y="-70%" width="240%" height="240%">
          <feGaussianBlur stdDeviation="7" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <rect x="0" y="0" width="400" height="800" fill="url(#skyGradient)"/>

      <!-- segments + stations injected here by JS -->
      <g id="segmentsGroup"></g>
      <g id="stationsGroup"></g>

      <g id="oceanGroup">
        <path class="oceanFill" id="oceanFill" d="M0 770 Q50 750 100 770 Q150 790 200 770 Q250 750 300 770 Q350 790 400 770 L400 800 L0 800 Z" fill="#2fd2ff"/>
        <text x="200" y="792" text-anchor="middle" font-size="20">🌊</text>
      </g>
    </svg>

    <div class="tribeCard" id="tribeCard">
      <div class="tribeInner">
        <div class="tribeEyebrow">A People Revealed</div>
        <div class="tribeName" id="tribeName">—</div>
        <div class="tribeSub">The system flowed complete. Tap anywhere to flow again.</div>
      </div>
    </div>

    <div class="sidePanel" id="tribesPanel">
      <div class="panelTitle">📜 Tribes Discovered</div>
      <div id="tribesList"><div class="emptyNote">Complete a full loop — Mountain to Ocean — to reveal your first tribe name.</div></div>
    </div>
  </div>

</div>

<script>

/* =========================================================
   CONFIGURE THE 6 STEPS — edit labels/names/meanings here
   Tap sequence per step: 1) highlight  2) reveal name  3) complete + flow
========================================================= */
const STEPS = [
  { id:"mountain", icon:"🏔", label:"Mountain",    name:"God",        meaning:"Water is separated" },
  { id:"dam",      icon:"🏗", label:"Dam",         name:"Firmament",  meaning:"Water is contained" },
  { id:"millpond", icon:"🌊", label:"Millpond",    name:"Seas",       meaning:"Water is gathered" },
  { id:"sluice",   icon:"🚪", label:"Sluice Gate", name:"Lights",     meaning:"Water is regulated" },
  { id:"wheel",    icon:"⚙",  label:"Waterwheel",  name:"Creatures",  meaning:"Water is moved" },
  { id:"mill",     icon:"🏭", label:"Mill",        name:"Man",        meaning:"Water performs work" }
];

const TRIBES = [
  "Adamites","Levites","Israelites","Jacobites","Hivites","Jebusites","Hittites",
  "Amorites","Canaanites","Perizzites","Girgashites","Moabites","Ammonites",
  "Edomites","Ishmaelites","Midianites","Kenites","Amalekites","Reubenites",
  "Simeonites","Gadites","Asherites","Ephraimites","Manassites","Danites",
  "Benjamites","Zebulunites","Rechabites"
];

/* Vertical layout of the 6 stations + ocean, in SVG viewBox units */
const CENTERS = [120, 245, 360, 470, 580, 690];
const OCEAN_Y = 770;

/* =========================================================
   STATE
========================================================= */
const state = {
  currentStep: 0,
  tapCount: 0,
  loop: 0,
  tribesFound: [],
  busy: false
};

const svg = document.getElementById("worldSVG");
const NS = "http://www.w3.org/2000/svg";
const stationsGroup = document.getElementById("stationsGroup");
const segmentsGroup = document.getElementById("segmentsGroup");
const world = document.getElementById("world");
const labelToast = document.getElementById("labelToast");
const progressRow = document.getElementById("progressRow");
const loopCountEl = document.getElementById("loopCount");
const oceanGroup = document.getElementById("oceanGroup");
const oceanFill = document.getElementById("oceanFill");
const tribeCard = document.getElementById("tribeCard");
const tribeName = document.getElementById("tribeName");
const tribesList = document.getElementById("tribesList");
const particleLayer = document.getElementById("particleLayer");

/* =========================================================
   BUILD PROGRESS DOTS
========================================================= */
STEPS.forEach(()=>{
  const dot = document.createElement("div");
  dot.className = "dot";
  dot.innerHTML = "<i></i>";
  progressRow.appendChild(dot);
});
function updateProgressDots(){
  const dots = progressRow.querySelectorAll(".dot i");
  dots.forEach((fillEl, i)=>{
    if(i < state.currentStep) fillEl.style.width = "100%";
    else if(i === state.currentStep) fillEl.style.width = (state.tapCount/3*100) + "%";
    else fillEl.style.width = "0%";
  });
}

/* =========================================================
   BUILD STATIONS + SEGMENTS (SVG, generated)
========================================================= */
function stationGraphic(step, index){
  const cy = CENTERS[index];
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "station locked");
  g.dataset.index = index;

  const ring = document.createElementNS(NS, "circle");
  ring.setAttribute("class", "ring");
  ring.setAttribute("cx", 200); ring.setAttribute("cy", cy); ring.setAttribute("r", 66);
  ring.setAttribute("fill", "none");
  ring.setAttribute("stroke", "var(--water-bright)");
  ring.setAttribute("stroke-width", 3);
  ring.setAttribute("filter", "url(#neonGlow)");
  g.appendChild(ring);

  const body = document.createElementNS(NS, "g");
  body.setAttribute("class", "body");

  const shape = document.createElementNS(NS, "circle");
  shape.setAttribute("cx", 200); shape.setAttribute("cy", cy); shape.setAttribute("r", 46);
  shape.setAttribute("fill", stationFill(index));
  shape.setAttribute("stroke", "rgba(255,255,255,.5)");
  shape.setAttribute("stroke-width", 2);
  body.appendChild(shape);

  const icon = document.createElementNS(NS, "text");
  icon.setAttribute("x", 200); icon.setAttribute("y", cy + 8);
  icon.setAttribute("text-anchor", "middle");
  icon.setAttribute("font-size", 30);
  icon.textContent = step.icon;
  body.appendChild(icon);

  g.appendChild(body);

  const check = document.createElementNS(NS, "text");
  check.setAttribute("class", "checkmark");
  check.setAttribute("x", 236); check.setAttribute("y", cy - 30);
  check.setAttribute("font-size", 22);
  check.textContent = "✅";
  g.appendChild(check);

  const nameLabel = document.createElementNS(NS, "text");
  nameLabel.setAttribute("class", "nameLabel");
  nameLabel.setAttribute("x", 200); nameLabel.setAttribute("y", cy + 78);
  nameLabel.setAttribute("text-anchor", "middle");
  nameLabel.setAttribute("font-size", 15);
  nameLabel.setAttribute("font-weight", "800");
  nameLabel.setAttribute("fill", "#ffd76a");
  nameLabel.textContent = step.name;
  g.appendChild(nameLabel);

  return g;
}

function stationFill(index){
  const fills = ["#6C74E8","#2fd2ff","#39c7ff","#EE8DF5","#2fd2ff","#6C74E8"];
  return fills[index % fills.length];
}

STEPS.forEach((step, i)=> stationsGroup.appendChild(stationGraphic(step, i)));

/* segments: 0..4 connect station[i]->station[i+1], segment 5 connects mill->ocean */
const segEnds = [...CENTERS.slice(1), OCEAN_Y];
const segments = [];
CENTERS.forEach((startY, i)=>{
  const endY = segEnds[i];
  const d = `M200 ${startY + 50} L200 ${endY - (i===5?60:50)}`;

  const track = document.createElementNS(NS, "path");
  track.setAttribute("class", "segTrack");
  track.setAttribute("d", d);
  segmentsGroup.appendChild(track);

  const flow = document.createElementNS(NS, "path");
  flow.setAttribute("class", "segFlow");
  flow.setAttribute("d", d);
  flow.setAttribute("pathLength", "100");
  segmentsGroup.appendChild(flow);

  segments.push(flow);
});

/* =========================================================
   TAP HANDLING
========================================================= */
stationsGroup.addEventListener("click", (e)=>{
  const g = e.target.closest(".station");
  if(!g || state.busy) return;
  const index = Number(g.dataset.index);
  if(index !== state.currentStep) return; // locked or already-done stations ignore taps

  const step = STEPS[index];
  g.classList.remove("tapped"); void g.offsetWidth; g.classList.add("tapped");

  state.tapCount++;

  if(state.tapCount === 1){
    g.classList.add("highlight");
    playTapSound();
    spawnFoamAt(g);
  } else if(state.tapCount === 2){
    g.classList.add("showName");
    playRevealSound();
    showToast(step.icon + "  " + step.name);
  } else if(state.tapCount === 3){
    g.classList.remove("active","highlight");
    g.classList.add("done");
    playCompleteSound();
    showToast(step.meaning);
    flowSegment(index);
  }

  updateProgressDots();
});

function activateStation(index){
  const g = stationsGroup.querySelector(`.station[data-index="${index}"]`);
  if(!g) return;
  g.classList.remove("locked");
  g.classList.add("active");
}

function flowSegment(index){
  state.busy = true;
  segments[index].classList.add("flowing");
  segments[index].style.strokeDashoffset = "0";
  playFlowSound();

  setTimeout(()=>{
    state.busy = false;
    state.tapCount = 0;
    if(index < STEPS.length - 1){
      state.currentStep = index + 1;
      activateStation(state.currentStep);
      updateProgressDots();
    } else {
      reachOcean();
    }
  }, 950);
}

/* =========================================================
   OCEAN + LOOP COMPLETE
========================================================= */
function reachOcean(){
  oceanGroup.classList.add("reached");
  playOceanSound();
  world.classList.add("flash");
  setTimeout(()=>world.classList.remove("flash"), 400);
  setTimeout(()=> completeLoop(), 900);
}

function completeLoop(){
  state.loop++;
  loopCountEl.textContent = state.loop;

  const tribe = pickTribe();
  state.tribesFound.push(tribe);
  renderTribesList();

  tribeName.textContent = tribe;
  tribeCard.classList.add("show");
  playLoopCompleteSound();

  const dismiss = ()=>{
    tribeCard.classList.remove("show");
    tribeCard.removeEventListener("click", dismiss);
    resetSystem();
  };
  tribeCard.addEventListener("click", dismiss);
  setTimeout(()=>{ if(tribeCard.classList.contains("show")) dismiss(); }, 3200);
}

let lastTribe = null;
function pickTribe(){
  let t;
  do{ t = TRIBES[Math.floor(Math.random()*TRIBES.length)]; } while(t === lastTribe && TRIBES.length > 1);
  lastTribe = t;
  return t;
}

function renderTribesList(){
  tribesList.innerHTML = "";
  const unique = [...new Set(state.tribesFound)];
  unique.slice().reverse().forEach(t=>{
    const item = document.createElement("div");
    item.className = "tribeItem";
    item.textContent = t;
    tribesList.appendChild(item);
  });
}

function resetSystem(){
  stationsGroup.querySelectorAll(".station").forEach(g=>{
    g.classList.remove("active","done","highlight","showName");
    g.classList.add("locked");
  });
  segments.forEach(seg=>{
    seg.style.transition = "none";
    seg.style.strokeDashoffset = "100";
    seg.classList.remove("flowing");
    void seg.offsetWidth;
    seg.style.transition = "";
  });
  oceanGroup.classList.remove("reached");
  state.currentStep = 0;
  state.tapCount = 0;
  activateStation(0);
  updateProgressDots();
}

/* =========================================================
   TOAST
========================================================= */
let toastTimer;
function showToast(text){
  labelToast.textContent = text;
  labelToast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> labelToast.classList.remove("show"), 1300);
}

function spawnFoamAt(stationEl){
  const rect = stationEl.getBoundingClientRect();
  const worldRect = world.getBoundingClientRect();
  const x = rect.left - worldRect.left + rect.width/2;
  const y = rect.top - worldRect.top + rect.height/2;
  for(let i=0;i<6;i++){
    const foam = document.createElement("div");
    foam.className = "foam";
    foam.style.left = (x + (Math.random()-.5)*50) + "px";
    foam.style.top = (y + (Math.random()-.5)*40) + "px";
    particleLayer.appendChild(foam);
    setTimeout(()=>foam.remove(), 1600);
  }
}

/* =========================================================
   FULLSCREEN
========================================================= */
const appRoot = document.getElementById("appRoot");
const fullscreenBtn = document.getElementById("fullscreenBtn");
function isFullscreen(){ return document.fullscreenElement || document.webkitFullscreenElement; }
function toggleFullscreen(){
  if(!isFullscreen()){
    const req = appRoot.requestFullscreen || appRoot.webkitRequestFullscreen;
    if(req) req.call(appRoot);
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit) exit.call(document);
  }
}
fullscreenBtn.addEventListener("click", toggleFullscreen);
["fullscreenchange","webkitfullscreenchange"].forEach(evt=>{

/* =========================================================
   AMBIENT MIST (light atmosphere, kept minimal)
========================================================= */
const mistLayer = document.getElementById("mistLayer");
function spawnMist(){
  const mist = document.createElement("div");
  mist.style.position = "absolute";
  mist.style.width = "110px"; mist.style.height = "55px";
  mist.style.borderRadius = "50%";
  mist.style.background = "rgba(47,210,255,.12)";
  mist.style.filter = "blur(18px)";
  mist.style.left = Math.random()*300+"px";
  mist.style.bottom = Math.random()*250+"px";
  mist.style.animation = "mistFloat 11s linear forwards";
  mistLayer.appendChild(mist);
  setTimeout(()=>mist.remove(), 11000);
}
const mistStyle = document.createElement("style");
mistStyle.textContent = "@keyframes mistFloat{from{transform:translateY(0);opacity:.4;}to{transform:translateY(-90px);opacity:0;}}";
document.head.appendChild(mistStyle);
setInterval(spawnMist, 3200);

/* subtle ocean wave motion */
let waveTime = 0;
function animateOcean(){
  waveTime += 0.025;
  const a = 770 + Math.sin(waveTime)*6;
  const b = 770 + Math.cos(waveTime)*6;
  const c = 770 + Math.sin(waveTime+1)*6;
  oceanFill.setAttribute("d", `M0 ${a} Q50 ${b} 100 ${a} Q150 ${c} 200 ${b} Q250 ${a} 300 ${c} Q350 ${b} 400 ${a} L400 800 L0 800 Z`);
  requestAnimationFrame(animateOcean);
}
animateOcean();

/* =========================================================
   WATER SOUND EFFECTS (synthesized — no external audio files)
========================================================= */
let audioCtx;
function getAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function playTone(freq, time, type){
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.value = 0.05;
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + time);
  osc.stop(ctx.currentTime + time);
}

function noiseBuffer(ctx, duration){
  const bufferSize = ctx.sampleRate * duration;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2 - 1);
  return buffer;
}

function playWaterNoise(duration, startFreq, endFreq, peakGain){
  const ctx = getAudio();
  const src = ctx.createBufferSource();
  src.buffer = noiseBuffer(ctx, duration);

  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.setValueAtTime(startFreq, ctx.currentTime);
  filter.frequency.linearRampToValueAtTime(endFreq, ctx.currentTime + duration);
  filter.Q.value = 0.8;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(peakGain, ctx.currentTime + duration*0.25);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

  src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
  src.start();
  src.stop(ctx.currentTime + duration);
}

function playTapSound(){ playTone(520 + Math.random()*80, 0.12, "sine"); }
function playRevealSound(){ playTone(760, 0.14, "triangle"); setTimeout(()=>playTone(980,0.18,"triangle"), 90); }
function playCompleteSound(){ playTone(420,0.1,"sine"); setTimeout(()=>playTone(640,0.22,"sine"), 90); }
function playFlowSound(){ playWaterNoise(0.9, 250, 1200, 0.12); }
function playOceanSound(){ playWaterNoise(1.4, 150, 500, 0.18); }
function playLoopCompleteSound(){

}

  try{
    window.parent.postMessage({ type:"resize", height: document.documentElement.scrollHeight }, "*");

}
