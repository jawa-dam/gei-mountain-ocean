<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>GEI System — Mountain to Ocean (Vertical 9:16 + Gravity)</title>
<style>
  :root{
    --bg:#e8f4fc;
    --ink:#1a2744;
    --body:#3b3f57;
    --muted:#6d7189;
    --hairline:#c5d8ea;
    --indigo:#4A6FA5;
    --indigo-deep:#2E4A7A;
    --water:#5BA3D9;
    --water-deep:#2E7BB8;
    --water-light:#A8D4F0;
    --foam:#eef8ff;
    --gold:#F5C542;
    --dry:#d4e2ef;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:linear-gradient(180deg,#d6ebf8 0%,#eef7fc 100%);
    font-family:var(--sans);
    color:var(--body);
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    overscroll-behavior:none;
    touch-action:none;
  }
  .stage{
    width:100%;
    max-width:480px;
    height:100dvh;
    max-height:100dvh;
    margin:0 auto;
    padding:env(safe-area-inset-top) clamp(0.5rem,2vw,0.9rem) env(safe-area-inset-bottom);
    display:flex;
    flex-direction:column;
    gap:0.5rem;
  }
  .top{
    flex:0 0 auto;
    text-align:center;
    padding-top:0.2rem;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:0.6rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--indigo-deep);
  }
  .title{
    font-family:var(--serif);
    color:var(--ink);
    font-size:clamp(1.05rem,3.8vw,1.32rem);
    font-weight:800;
    margin-top:0.15rem;
    line-height:1.15;
  }
  .subtitle{
    font-family:var(--mono);
    font-size:0.6rem;
    color:var(--muted);
    margin-top:0.25rem;
  }

  .diagram-frame{
    position:relative;
    width:100%;
    flex:1 1 auto;
    min-height:0;
    max-width:100%;
    aspect-ratio:9 / 16;
    max-height:calc(100dvh - 158px);
    margin:0 auto;
    border:3px solid #b8d4ea;
    border-radius:28px;
    background:#f7fbfe;
    overflow:hidden;
    cursor:grab;
    box-shadow:0 18px 44px rgba(46,74,122,0.20);
    transform:scale(1);
    transition:transform 0.18s cubic-bezier(.34,1.56,.64,1);
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .diagram-frame:active{ cursor:grabbing; }
  .diagram-frame.pulse{ animation: framePulse 0.32s ease; }
  .diagram-frame.swiping{ transform:scale(0.985) translateY(2px); }
  @keyframes framePulse{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.016); }
    100%{ transform:scale(1); }
  }
  svg.scene{width:100%;height:100%;display:block;}

  .caption-pill{
    position:absolute;
    top:10px;left:50%;
    transform:translateX(-50%);
    font-family:var(--serif);
    font-weight:700;
    font-style:italic;
    color:var(--ink);
    background:rgba(255,255,255,0.97);
    border:2px solid #c5d8ea;
    padding:0.42em 1em;
    border-radius:40px;
    font-size:clamp(0.78rem,2.8vw,0.92rem);
    text-align:center;
    width:max-content;
    max-width:88%;
    box-shadow:0 4px 18px rgba(26,39,68,0.10);
    pointer-events:none;
    z-index:7;
    line-height:1.25;
  }
  .caption-pill.bump{ animation: captionBump 0.4s ease; }
  @keyframes captionBump{
    0%{ transform:translateX(-50%) scale(1); }
    30%{ transform:translateX(-50%) scale(1.08); }
    100%{ transform:translateX(-50%) scale(1); }
  }

  /* swipe hint arrow */
  .swipe-hint{
    position:absolute;
    left:50%;
    top:46%;
    transform:translate(-50%,-50%);
    z-index:6;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.3s ease;
    text-align:center;
  }
  .swipe-hint.show{ opacity:0.9; }
  .swipe-hint .arrow{
    font-size:1.8rem;
    animation: hintBounce 0.9s ease-in-out infinite;
    display:block;
    color:var(--indigo-deep);
  }
  .swipe-hint .label{
    font-family:var(--mono);
    font-size:0.6rem;
    color:var(--indigo-deep);
    background:rgba(255,255,255,0.9);
    padding:0.2em 0.6em;
    border-radius:12px;
    border:1px solid #c5d8ea;
    margin-top:0.2rem;
    display:inline-block;
  }
  @keyframes hintBounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(8px); }
  }

  .streak-badge{
    position:absolute;
    top:52px; right:12px;
    z-index:7;
    font-family:var(--mono);
    font-size:0.64rem;
    letter-spacing:0.04em;
    color:#fff;
    background:linear-gradient(120deg,#2E7BB8,#4A6FA5);
    padding:0.36em 0.7em;
    border-radius:20px;
    box-shadow:0 4px 14px rgba(46,74,122,0.28);
    opacity:0;
    transform:translateY(-8px) scale(0.85);
    transition:opacity 0.3s ease, transform 0.3s ease;
    pointer-events:none;
  }
  .streak-badge.show{ opacity:1; transform:translateY(0) scale(1); }
  .streak-badge.pop{ animation: badgePop 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes badgePop{
    0%{ transform:translateY(0) scale(1); }
    40%{ transform:translateY(0) scale(1.25); }
    100%{ transform:translateY(0) scale(1); }
  }

  .ites-badge{
    position:absolute;
    bottom:12px; left:50%;
    transform:translateX(-50%);
    z-index:7;
    font-family:var(--serif);
    font-size:0.84rem;
    font-weight:700;
    color:var(--indigo-deep);
    background:rgba(255,255,255,0.96);
    border:2px solid var(--gold);
    padding:0.34em 0.9em;
    border-radius:30px;
    box-shadow:0 4px 16px rgba(245,197,66,0.28);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s ease;
    white-space:nowrap;
  }
  .ites-badge.show{ opacity:1; }

  .system-banner{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(91,163,217,0.16),rgba(46,123,184,0.20));
    opacity:0;pointer-events:none;
    transition:opacity 0.55s ease;
    z-index:9;
  }
  .system-banner.show{opacity:1;}
  .system-banner .card{
    background:#fff;
    border:2px solid #c5d8ea;
    border-radius:16px;
    padding:1rem 1.5rem;
    text-align:center;
    box-shadow:0 14px 36px rgba(26,39,68,0.18);
    transform:scale(0.9);
    transition:transform 0.4s cubic-bezier(.34,1.56,.64,1);
    max-width:84%;
  }
  .system-banner.show .card{ transform:scale(1); }
  .system-banner .card .eyebrow{display:block;text-align:center;}
  .system-banner .card h3{
    font-family:var(--serif);
    color:var(--ink);
    font-size:clamp(1.02rem,3.4vw,1.22rem);
    margin-top:0.25rem;
    line-height:1.3;
  }

  .controls{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:0.55rem;
  }
  .steps-track{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0.3rem;
  }
  .step-pill{
    font-family:var(--mono);
    font-size:0.6rem;
    letter-spacing:0.02em;
    padding:0.4em 0.55em;
    border-radius:20px;
    border:1px solid #c5d8ea;
    color:var(--muted);
    background:#fff;
    white-space:nowrap;
    transition:all 0.35s ease, transform 0.3s cubic-bezier(.34,1.56,.64,1);
    text-align:center;
  }
  .step-pill .n{font-weight:700;margin-right:0.26em;}
  .step-pill.done{color:var(--indigo-deep);border-color:#8ab4d8;background:#eef6fc;}
  .step-pill.active{
    color:#fff;
    border-color:var(--indigo-deep);
    background:linear-gradient(120deg,#4A6FA5,#2E7BB8);
    box-shadow:0 3px 10px rgba(46,123,184,0.35);
    transform:scale(1.04);
  }
  .btn-row{display:flex;gap:0.5rem;}
  .btn-row button{flex:1;}
  button{
    font-family:var(--mono);
    font-size:0.74rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:0.72em 0.9em;
    border-radius:12px;
    border:1px solid var(--indigo-deep);
    background:var(--indigo-deep);
    color:#fff;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.2s ease;
  }
  button:hover{transform:translateY(-1px);}
  button:active{transform:scale(0.96);}
  button.secondary{background:#fff;color:var(--indigo-deep);}

  /* SVG STYLES */
  .node{opacity:0.38;transition:opacity 0.55s ease, filter 0.55s ease;}
  .node.active{opacity:1;filter:none;}
  .node.highlight{opacity:0.96;filter:drop-shadow(0 0 14px rgba(91,163,217,0.7));}
  .node-label{
    font-family:var(--mono);
    font-size:10.2px;
    fill:#7a8a9e;
    text-transform:uppercase;
    letter-spacing:0.6px;
    transition:fill 0.4s ease, opacity 0.4s;
  }
  .node-label.active{fill:var(--indigo-deep);font-weight:800;}
  .node-label.reveal{fill:var(--gold);font-weight:800;filter:drop-shadow(0 1px 0 rgba(0,0,0,0.18));}

  .seg{fill:#d4e2ef;transition:fill 0.9s ease, filter 0.9s ease;}
  .seg.wet{fill:url(#riverGrad);filter:drop-shadow(0 2px 6px rgba(30,80,120,0.38));}
  .flow{
    stroke:#ffffff;
    stroke-width:4.6;
    fill:none;
    stroke-dasharray:9 13;
    opacity:0;
    transition:opacity 0.5s ease;
    stroke-linecap:round;
  }
  .flow.on{opacity:0.92; animation:flowmove linear infinite;}
  #flow1.on{animation-duration:1.5s;}
  #flow2.on{animation-duration:1.25s;}
  #flow3.on{animation-duration:1.05s;}
  #flow4.on{animation-duration:0.88s;}
  #flow5.on{animation-duration:0.72s;}
  #flow6.on{animation-duration:0.58s;}
  .flow-foam{
    stroke:#eef8ff;
    stroke-width:2.2;
    fill:none;
    stroke-dasharray:4 8;
    opacity:0;
    stroke-linecap:round;
  }
  .flow-foam.on{opacity:0.9; animation:flowmove linear infinite;}
  #foam1.on{animation-duration:0.85s;}
  #foam2.on{animation-duration:0.72s;}
  #foam3.on{animation-duration:0.6s;}
  #foam4.on{animation-duration:0.52s;}
  #foam5.on{animation-duration:0.44s;}
  #foam6.on{animation-duration:0.36s;}
  @keyframes flowmove{to{stroke-dashoffset:-44;}}
  .flow-overlay{opacity:0;transition:opacity 0.6s ease;}
  .flow-overlay.on{opacity:0.96;}

  .wheel-spin{transform-origin:center;transform-box:fill-box;}
  .wheel-spin.spin{animation:spin 2.2s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .wheel-drop{opacity:0;}
  .wheel-drop.on{opacity:1;animation:wheelFling 1.15s ease-in infinite;}
  @keyframes wheelFling{
    0%{ transform:translate(0,0) scale(1); opacity:0.9; }
    100%{ transform:translate(-22px,18px) scale(0.2); opacity:0; }
  }

  .ocean-fill{fill:#c5d8ea;transition:fill 1s ease;}
  .ocean-fill.wet{fill:url(#oceanGrad);}
  .wave{opacity:0;transition:opacity 0.7s ease;}
  .wave.on{opacity:0.78; animation: waveDrift 3.2s ease-in-out infinite; }
  .wave:nth-of-type(2).on{ animation-duration:4s; animation-delay:0.35s; }
  @keyframes waveDrift{0%,100%{transform:translateX(0);}50%{transform:translateX(6px);}}

  .idle-bob{ animation: idleBob 4.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes idleBob{0%,100%{transform:translateY(0);}50%{transform:translateY(1.2px);}}

  .drip,.glow{opacity:0;transition:opacity 0.5s ease;}
  .drip.on,.glow.on{opacity:1;}
  .drip.on{ animation: dripFall 1.2s ease-in infinite; }
  @keyframes dripFall{0%{transform:translateY(0);opacity:1;}85%{opacity:1;}100%{transform:translateY(12px);opacity:0;}}
  .glow.on{ animation: glowPulse 1.8s ease-in-out infinite; }
  @keyframes glowPulse{0%,100%{opacity:0.55;}50%{opacity:1;}}

  .splash-particle{
    transform-box:fill-box;
    transform-origin:center;
    opacity:0.92;
    animation: splashFly 0.72s ease-out forwards;
  }
  @keyframes splashFly{
    0%{ transform:translate(0,0) scale(1); opacity:0.95; }
    100%{ transform:translate(var(--dx,10px),var(--dy,-14px)) scale(0.15); opacity:0; }
  }
  .ripple{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.62), rgba(91,163,217,0.30) 60%, transparent 70%);
    pointer-events:none;
    transform:translate(-50%,-50%) scale(0);
    animation: rippleGrow 0.65s ease-out forwards;
    z-index:5;
  }
  @keyframes rippleGrow{0%{transform:translate(-50%,-50%) scale(0);opacity:0.9;}100%{transform:translate(-50%,-50%) scale(1);opacity:0;}}

  /* Gravity drops (SVG) */
  .gdrop-core{ fill:#1f6da8; }
  .gdrop-hi{ fill:#d4efff; opacity:0.92; }
  .gdrop-tail{ fill:#5BA3D9; opacity:0.55; }

  /* Fullscreen styling */
  :fullscreen .stage,
  .stage.is-fullscreen{
    max-width:100vw;
    width:100vw;
    height:100dvh;
    padding:0;
    background:linear-gradient(180deg,#d6ebf8 0%,#eef7fc 100%);
  }
  :fullscreen .top,
  .is-fullscreen .top{ padding:0.6rem 0.8rem 0.2rem; }
  :fullscreen .controls,
  .is-fullscreen .controls{ padding:0 0.7rem calc(0.7rem + env(safe-area-inset-bottom)); background:rgba(255,255,255,0.88); backdrop-filter:blur(8px); border-top:1px solid #c5d8ea; }
  :fullscreen .diagram-frame,
  .is-fullscreen .diagram-frame{
    border-radius:0;
    border-left:none;
    border-right:none;
    border-top:2px solid #b8d4ea;
    border-bottom:2px solid #b8d4ea;
    max-height:none;
    aspect-ratio:9 / 16;
    width:min(100vw, calc(100dvh * 0.5625 * 1.05));
    box-shadow:none;
  }

  @media (min-width:700px){
    .stage{ max-width:460px; }
  }
  @media (prefers-reduced-motion:reduce){
    .flow.on, .flow-foam.on, .wheel-spin.spin, .wave.on, .idle-bob, .drip.on, .glow.on{animation:none;}
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="top">
    <div class="eyebrow">Genesis Engineered Interpretations · yalltoo</div>
    <h2 class="title">Mountain to Ocean — Vertical Gravity</h2>
    <div class="subtitle">tap · swipe down ↓ · fullscreen → gravity drops</div>
  </div>

  <div class="diagram-frame" id="diagramFrame">
    <div class="caption-pill" id="captionPill">Tap 3× per step · Swipe ↓ to drop</div>
    <div class="streak-badge" id="streakBadge">Loop 1</div>
    <div class="ites-badge" id="itesBadge">🌊 Israelites</div>
    <div class="swipe-hint" id="swipeHint"><span class="arrow">↓</span><span class="label">SWIPE DOWN</span></div>

    <svg class="scene" viewBox="0 0 380 680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#eaf5fc"/><stop offset="100%" stop-color="#f7fbfe"/>
        </linearGradient>
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7ec4ea"/><stop offset="100%" stop-color="#3a8ec8"/>
        </linearGradient>
        <linearGradient id="mountainSnow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#d8e8f5"/>
        </linearGradient>
        <linearGradient id="rockFaceA" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8ea0b8"/><stop offset="100%" stop-color="#4f5f76"/>
        </linearGradient>
        <linearGradient id="rockFaceB" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#a5b6cb"/><stop offset="100%" stop-color="#6a7d96"/>
        </linearGradient>
        <linearGradient id="pineGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4d7a52"/><stop offset="100%" stop-color="#2f5a38"/>
        </linearGradient>
        <linearGradient id="concreteFace" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#e4ecf2"/><stop offset="45%" stop-color="#c7d5e0"/><stop offset="100%" stop-color="#9fb2c2"/>
        </linearGradient>
        <linearGradient id="damWaterFace" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#bfe0f5"/><stop offset="100%" stop-color="#3d8fc4"/>
        </linearGradient>
        <linearGradient id="metalGear" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#e8c98a"/><stop offset="50%" stop-color="#c69b52"/><stop offset="100%" stop-color="#8a6a34"/>
        </linearGradient>
        <linearGradient id="factoryBrick" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#b98f6f"/><stop offset="100%" stop-color="#8a6248"/>
        </linearGradient>
        <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#bfe6fb"/><stop offset="30%" stop-color="#5BA3D9"/><stop offset="100%" stop-color="#1f5d84"/>
        </linearGradient>
        <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#4aa0d6"/><stop offset="100%" stop-color="#153c5c"/>
        </linearGradient>
        <pattern id="riverTexture" patternUnits="userSpaceOnUse" width="18" height="34" patternTransform="rotate(90)">
          <rect width="18" height="34" fill="rgba(255,255,255,0)"/>
          <path d="M9, -4 Q15,4 9,12 T9,28 T9,44" stroke="rgba(255,255,255,0.38)" stroke-width="1.4" fill="none"/>
        </pattern>
        <radialGradient id="dropGrad" cx="0.35" cy="0.28" r="0.75">
          <stop offset="0%" stop-color="#d8efff"/><stop offset="28%" stop-color="#7ec4ea"/><stop offset="100%" stop-color="#1c5a86"/>
        </radialGradient>
      </defs>

      <rect width="380" height="680" fill="url(#sky)"/>
      <rect x="168" y="18" width="36" height="610" rx="14" fill="#e2eef7" opacity="0.9"/>

      <rect id="seg1" class="seg" x="174" y="22" width="26" height="68" rx="10"/>
      <rect id="seg2" class="seg" x="174" y="116" width="26" height="58" rx="10"/>
      <rect id="seg3" class="seg" x="174" y="216" width="26" height="56" rx="10"/>
      <rect id="seg4" class="seg" x="174" y="316" width="26" height="52" rx="10"/>
      <rect id="seg5" class="seg" x="174" y="414" width="26" height="64" rx="10"/>
      <rect id="seg6" class="seg" x="174" y="532" width="26" height="78" rx="10"/>

      <rect id="ov1" class="flow-overlay" x="174" y="22" width="26" height="68" rx="10" fill="url(#riverTexture)"/>
      <rect id="ov2" class="flow-overlay" x="174" y="116" width="26" height="58" rx="10" fill="url(#riverTexture)"/>
      <rect id="ov3" class="flow-overlay" x="174" y="216" width="26" height="56" rx="10" fill="url(#riverTexture)"/>
      <rect id="ov4" class="flow-overlay" x="174" y="316" width="26" height="52" rx="10" fill="url(#riverTexture)"/>
      <rect id="ov5" class="flow-overlay" x="174" y="414" width="26" height="64" rx="10" fill="url(#riverTexture)"/>
      <rect id="ov6" class="flow-overlay" x="174" y="532" width="26" height="78" rx="10" fill="url(#riverTexture)"/>

      <path id="flow1" class="flow" d="M187,24 V88"/>
      <path id="flow2" class="flow" d="M187,118 V172"/>
      <path id="flow3" class="flow" d="M187,218 V270"/>
      <path id="flow4" class="flow" d="M187,318 V366"/>
      <path id="flow5" class="flow" d="M187,416 V476"/>
      <path id="flow6" class="flow" d="M187,534 V606"/>

      <path id="foam1" class="flow-foam" d="M179,26 V86"/>
      <path id="foam2" class="flow-foam" d="M179,120 V170"/>
      <path id="foam3" class="flow-foam" d="M179,220 V268"/>
      <path id="foam4" class="flow-foam" d="M179,320 V364"/>
      <path id="foam5" class="flow-foam" d="M179,418 V474"/>
      <path id="foam6" class="flow-foam" d="M179,536 V604"/>

      <!-- 1. MOUNTAIN -->
      <g id="node-mountain" class="node">
        <ellipse cx="190" cy="98" rx="88" ry="16" fill="#a9bccf" opacity="0.35"/>
        <path d="M38,96 L98,42 L122,62 L156,12 L178,36 L190,8 L202,36 L224,12 L258,62 L282,42 L342,96 Z" fill="url(#rockFaceA)"/>

<script>
(function(){
  var NAMES = {
    1: { physical: "Mountain", symbolic: "God" },
    2: { physical: "Dam", symbolic: "Heaven" },
    3: { physical: "Millpond", symbolic: "Earth" },
    4: { physical: "Sluice Gate", symbolic: "2 Great Lights" },
    5: { physical: "Waterwheel", symbolic: "Great whales" },
    6: { physical: "Mill", symbolic: "Beast" }
  };
  var CAPTIONS = {
    0: "Swipe ↓ or Tap to drop from the summit",
    1: {1: "Highlight the Mountain…", 2: "Mountain = God", 3: "Snowmelt drops — gravity begins."},
    2: {1: "Highlight the Dam…", 2: "Dam = Heaven", 3: "Heaven contains — drop accelerates."},
    3: {1: "Highlight the Millpond…", 2: "Millpond = Earth", 3: "Earth gathers — momentum holds."},
    4: {1: "Highlight the Sluice…", 2: "Sluice = 2 Great Lights", 3: "Gate regulates — flow still falls."},
    5: {1: "Highlight the Waterwheel…", 2: "Waterwheel = Great whales", 3: "Whales move it — full speed now."},
    6: {1: "Highlight the Mill…", 2: "Mill = Beast", 3: "Work done — plunges to Ocean."}
  };
  var ITES = ["Israelites 🌊","Jacobites 🌊","Adamites 🌊","Levites 🌊","Canaanites 🌊","Amorites 🌊","Hittites 🌊","Jebusites 🌊","Perizzites 🌊","Hivites 🌊","Girgashites 🌊","Kenites 🌊","Rechabites 🌊","Nethinim 🌊","Samaritans 🌊"];
  var LOOP_TITLES = ["A system emerges.","The flow holds steady.","Water remembers its fall.","Every gate in rhythm.","Mountain to ocean, again.","Engineered order repeats."];

  var TOTAL=6, step=0, subTap=0, loopCount=1, emerged=false;
  var svgNS="http://www.w3.org/2000/svg";

  var caption=document.getElementById('captionPill');
  var nextBtn=document.getElementById('nextBtn');
  var resetBtn=document.getElementById('resetBtn');
  var fsBtn=document.getElementById('fsBtn');
  var banner=document.getElementById('systemBanner');
  var bannerTitle=document.getElementById('bannerTitle');
  var bannerEyebrow=document.getElementById('bannerEyebrow');
  var frame=document.getElementById('diagramFrame');
  var stage=document.getElementById('stage');
  var streakBadge=document.getElementById('streakBadge');
  var itesBadge=document.getElementById('itesBadge');
  var swipeHint=document.getElementById('swipeHint');
  var pills=document.querySelectorAll('.step-pill');
  var svg=document.querySelector('svg.scene');
  var gravityLayer=document.getElementById('gravityLayer');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Audio */
  var audioCtx=null;
  function ensureAudio(){
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }
  function playDroplet(intensity){
    ensureAudio();
    intensity=intensity||0.7;
    var t=audioCtx.currentTime;
    var osc=audioCtx.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(920+Math.random()*80,t);
    osc.frequency.exponentialRampToValueAtTime(280+Math.random()*40,t+0.18);
    var gain=audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001,t);
    gain.gain.exponentialRampToValueAtTime(0.18*intensity,t+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
    var osc2=audioCtx.createOscillator(); osc2.type='sine';
    osc2.frequency.setValueAtTime(1840+Math.random()*120,t);
    osc2.frequency.exponentialRampToValueAtTime(620,t+0.12);
    var gain2=audioCtx.createGain();
    gain2.gain.setValueAtTime(0.0001,t);
    gain2.gain.exponentialRampToValueAtTime(0.05*intensity,t+0.008);
    gain2.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+0.25);
    osc2.start(t); osc2.stop(t+0.15);
  }
  function playSoftSplash(i){
    ensureAudio(); i=i||0.75; playDroplet(i*0.85);
    var t=audioCtx.currentTime; var osc=audioCtx.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(180+Math.random()*30,t);
    osc.frequency.exponentialRampToValueAtTime(70,t+0.28);
    var g=audioCtx.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.09*i,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+0.35);
  }
  function playSoftDrip(){ playDroplet(0.55); }
  function playSplash(i){ playSoftSplash(i||0.7); }

  function on(id,cls,state){ var el=document.getElementById(id); if(el) el.classList.toggle(cls,state); }

  function spawnSplash(cx,cy,count){
    if(reduce) return; count=count||6;
    for(var i=0;i<count;i++){
      var c=document.createElementNS(svgNS,'circle');
      var ang=(Math.random()*Math.PI*1.6)-Math.PI*0.8;
      var dist=12+Math.random()*20;
      var dx=Math.cos(ang)*dist; var dy=Math.sin(ang)*dist+6;
      c.setAttribute('cx',cx); c.setAttribute('cy',cy);
      c.setAttribute('r',2+Math.random()*2.2);
      c.setAttribute('class','splash-particle');
      c.style.setProperty('--dx',dx+'px'); c.style.setProperty('--dy',dy+'px');
      c.style.fill=Math.random()>0.5?'#a8d4f0':'#2E7BB8';
      svg.appendChild(c);
      (function(el){ setTimeout(function(){ el.remove(); },740); })(c);
    }
  }
  function spawnRipple(clientX,clientY){
    if(reduce) return;
    var rect=frame.getBoundingClientRect();
    var r=document.createElement('div'); r.className='ripple';
    var size=Math.max(rect.width,rect.height)*0.32;
    r.style.width=size+'px'; r.style.height=size+'px';
    r.style.left=(clientX-rect.left)+'px'; r.style.top=(clientY-rect.top)+'px';
    frame.appendChild(r); setTimeout(function(){ r.remove(); },720);
  }

  function bumpCaption(){ caption.classList.remove('bump'); void caption.offsetWidth; caption.classList.add('bump'); }
  function pulseFrame(){ if(reduce) return; frame.classList.remove('pulse'); void frame.offsetWidth; frame.classList.add('pulse'); }
  function popBadge(){ streakBadge.classList.remove('pop'); void streakBadge.offsetWidth; streakBadge.classList.add('pop'); }

  function celebrateStep(n){
    switch(n){
      case 1: spawnSplash(190,88,7); break;
      case 2: spawnSplash(190,210,8); break;
      case 3: spawnSplash(190,268,9); break;
      case 4: spawnSplash(190,400,7); break;
      case 5: spawnSplash(190,466,10); break;
      case 6: spawnSplash(190,570,8); spawnSplash(190,632,14); break;
    }
  }

  function clearHighlights(){
    ['node-mountain','node-dam','node-millpond','node-sluice','node-wheel','node-mill-inner']
      .forEach(function(id){ on(id,'highlight',false); });
  }
  function setLabel(num,mode){
    var map={1:'lbl-mountain',2:'lbl-dam',3:'lbl-millpond',4:'lbl-sluice',5:'lbl-wheel',6:'lbl-mill'};
    var id=map[num]; var el=document.getElementById(id); if(!el) return;
    el.classList.remove('active','reveal');
    if(mode==='reveal'){ el.textContent=num+' · '+NAMES[num].symbolic; el.classList.add('reveal'); }
    else if(mode==='active'){ el.textContent=num+' · '+NAMES[num].symbolic; el.classList.add('active'); }
    else{ el.textContent=num+' · '+NAMES[num].physical; }
  }

  /* ===== GRAVITY PHYSICS ===== */
  // drops = [{g, x, y, vy, ay, toY, size, hitDone}]
  var gravityDrops=[];
  var GRAVITY_BASE = 2100; // svg units / s^2
  function launchGravityDrop(opts){
    // opts: fromY, toY, x(190), vy0, size, colorMain
    var o = opts||{};
    var fromY=o.fromY!=null?o.fromY:32;
    var toY=o.toY!=null?o.toY:122;
    var x=o.x!=null?o.x:190;
    var vy0=o.vy0!=null?o.vy0:0;
    var size=o.size||5.5;
    var ay=o.ay!=null?o.ay:(GRAVITY_BASE + Math.random()*500);

    var g=document.createElementNS(svgNS,'g');
    g.setAttribute('transform','translate('+x+','+fromY+')');

    // tail that stretches with velocity
    var tail=document.createElementNS(svgNS,'ellipse');
    tail.setAttribute('cx',0); tail.setAttribute('cy',size*1.2);
    tail.setAttribute('rx',size*0.55); tail.setAttribute('ry',size*1.3);
    tail.setAttribute('class','gdrop-tail');

    var core=document.createElementNS(svgNS,'circle');
    core.setAttribute('cx',0); core.setAttribute('cy',0);
    core.setAttribute('r',size);
    core.setAttribute('fill','url(#dropGrad)');
    core.setAttribute('stroke','#1a4a71'); core.setAttribute('stroke-width','0.6'); core.setAttribute('opacity','0.95');

    var hi=document.createElementNS(svgNS,'circle');
    hi.setAttribute('cx',-size*0.28); hi.setAttribute('cy',-size*0.28);
    hi.setAttribute('r',size*0.32); hi.setAttribute('class','gdrop-hi');

    g.appendChild(tail); g.appendChild(core); g.appendChild(hi);
    gravityLayer.appendChild(g);

    gravityDrops.push({
      g:g, tail:tail, x:x, y:fromY, vy:vy0, ay:ay, toY:toY, size:size,
      hitDone:false, cx:o.onHitX||x, cy:o.onHitY||toY
    });

    if(navigator.vibrate && o.haptic) navigator.vibrate(12);
  }

  function launchDropForStep(stepNum, swipeVelocity){
    // map step to svg Y path
    var paths={
      1:{from:26, to:122},
      2:{from:164, to:230},
      3:{from:230, to:312},
      4:{from:314, to:390},
      5:{from:390, to:500},
      6:{from:500, to:628}
    };
    var p=paths[stepNum]||{from:32,to:122};
    var vy0=0;
    if(swipeVelocity){
      // swipeVelocity px/s -> svg units/s
      // convert: svg 680 = frame px height
      var frameH=frame.clientHeight||600;
      var svgPerPx=680/frameH;
      vy0 = swipeVelocity * svgPerPx * 0.35;
      vy0=Math.min(1800, Math.max(0,vy0));
    }
    var size = stepNum===6?7:5.5 + (vy0/600);
    launchGravityDrop({fromY:p.from, toY:p.to, x:190, vy0:vy0, size:size, ay:GRAVITY_BASE + vy0*0.15});
    // also trail of smaller droplets if fast swipe
    if(vy0>600){
      setTimeout(function(){
        launchGravityDrop({fromY:p.from+6, toY:p.to, x:190+ (Math.random()*10-5), vy0:vy0*0.6, size:size*0.6, ay:GRAVITY_BASE});
      },60);
    }
  }

  var lastRaf=performance.now();
  function gravityRaf(now){
    var dt=Math.min(0.05, (now-lastRaf)/1000); // sec
    lastRaf=now;
    for(var i=gravityDrops.length-1;i>=0;i--){
      var d=gravityDrops[i];
      if(d.hitDone) continue;
      d.vy += d.ay * dt;
      d.y += d.vy * dt;
      // stretch tail by velocity
      var stretch = 1 + d.vy/550;
      d.tail.setAttribute('cy', d.size*0.8*stretch*0.55);
      d.tail.setAttribute('ry', d.size*0.9*stretch);
      d.tail.setAttribute('rx', Math.max(1, d.size*0.6 / Math.sqrt(stretch)));
      d.g.setAttribute('transform','translate('+d.x+','+d.y+')');
      if(d.y >= d.toY){
        // impact
        d.hitDone=true;
        spawnSplash(d.cx, d.cy, 5 + Math.floor(d.vy/300));
        // ripple
        d.g.remove();
        gravityDrops.splice(i,1);
        // soft splash sound with intensity based on velocity
        var inten=Math.min(1, 0.5 + d.vy/1200);
        playSplash(inten);
      }
    }
    requestAnimationFrame(gravityRaf);
  }
  requestAnimationFrame(gravityRaf);

  /* ===== RENDER ===== */
  function render(){
    on('node-mountain','active', step>1 || (step===1 && subTap===3) || emerged);
    on('node-dam','active', step>2 || (step===2 && subTap===3) || emerged);
    on('node-millpond','active', step>3 || (step===3 && subTap===3) || emerged);
    on('node-sluice','active', step>4 || (step===4 && subTap===3) || emerged);
    on('node-wheel','active', step>5 || (step===5 && subTap===3) || emerged);
    on('node-mill-inner','active', step>6 || (step===6 && subTap===3) || emerged);

    clearHighlights();
    if(subTap===1 && step>=1 && step<=6){
      var nodeMap={1:'node-mountain',2:'node-dam',3:'node-millpond',4:'node-sluice',5:'node-wheel',6:'node-mill-inner'};
      on(nodeMap[step],'highlight',true);
    }
    for(var s=1;s<=6;s++){
      if(s<step || (s===step && subTap===3) || emerged) setLabel(s,'active');
      else if(s===step && subTap===2) setLabel(s,'reveal');
      else setLabel(s,'physical');
    }
    on('drip-mountain','on', step>=1 && subTap>=2);
    on('drip-mountain2','on', step>=1 && subTap>=2);
    on('dam-churn','on', step>2 || (step===2 && subTap===3));
    on('pond-ripple1','on', step>3 || (step===3 && subTap===3));
    on('pond-ripple2','on', step>3 || (step===3 && subTap===3));
    on('sluice-arrow','on', step>4 || (step===4 && subTap===3));
    var wheelActive=(step>5 || (step===5 && subTap===3) || emerged) && !reduce;
    ['wheel-group','gear-large'].forEach(function(id){ var g=document.getElementById(id); if(g) g.classList.toggle('spin',wheelActive); });
    ['wd1','wd2','wd3'].forEach(function(id){ on(id,'on', step>5 || (step===5 && subTap===3)); });
    on('glow-mill','on', step>6 || (step===6 && subTap===3) || emerged);

    on('seg1','wet', step>1 || (step===1 && subTap===3) || emerged);
    on('seg2','wet', step>2 || (step===2 && subTap===3) || emerged);
    on('seg3','wet', step>3 || (step===3 && subTap===3) || emerged);
    on('seg4','wet', step>4 || (step===4 && subTap===3) || emerged);
    on('seg5','wet', step>5 || (step===5 && subTap===3) || emerged);
    on('seg6','wet', step>6 || (step===6 && subTap===3) || emerged);

    on('flow1','on', step>1 || (step===1 && subTap===3) || emerged); on('foam1','on', step>1 || (step===1 && subTap===3) || emerged); on('ov1','on', step>1 || (step===1 && subTap===3) || emerged);
    on('flow2','on', step>2 || (step===2 && subTap===3) || emerged); on('foam2','on', step>2 || (step===2 && subTap===3) || emerged); on('ov2','on', step>2 || (step===2 && subTap===3) || emerged);
    on('flow3','on', step>3 || (step===3 && subTap===3) || emerged); on('foam3','on', step>3 || (step===3 && subTap===3) || emerged); on('ov3','on', step>3 || (step===3 && subTap===3) || emerged);
    on('flow4','on', step>4 || (step===4 && subTap===3) || emerged); on('foam4','on', step>4 || (step===4 && subTap===3) || emerged); on('ov4','on', step>4 || (step===4 && subTap===3) || emerged);
    on('flow5','on', step>5 || (step===5 && subTap===3) || emerged); on('foam5','on', step>5 || (step===5 && subTap===3) || emerged); on('ov5','on', step>5 || (step===5 && subTap===3) || emerged);
    on('flow6','on', step>6 || (step===6 && subTap===3) || emerged); on('foam6','on', step>6 || (step===6 && subTap===3) || emerged); on('ov6','on', step>6 || (step===6 && subTap===3) || emerged);

    on('oceanRect','wet', step>6 || (step===6 && subTap===3) || emerged);
    on('wave1','on', step>6 || (step===6 && subTap===3));
    on('wave2','on', step>6 || (step===6 && subTap===3));
    on('lbl-ocean','active', step>6 || (step===6 && subTap===3) || emerged);

    pills.forEach(function(p){
      var n=+p.getAttribute('data-step');
      p.classList.remove('active','done');
      if(n<step || (n===step && subTap===3) || emerged) p.classList.add('done');
      if(n===step && subTap>0 && subTap<3) p.classList.add('active');
    });

    caption.textContent = step===0 ? CAPTIONS[0] : (CAPTIONS[step][subTap]||CAPTIONS[step][3]);
    banner.classList.toggle('show', step===TOTAL && subTap===3);
    nextBtn.textContent = (step===TOTAL && subTap===3) ? 'LOOP ↺' : 'DROP ↓';
    streakBadge.textContent='Loop '+loopCount;
    streakBadge.classList.toggle('show', loopCount>1 || (step===TOTAL && subTap===3));
    var itesName=ITES[(loopCount-1)%ITES.length]; itesBadge.textContent=itesName;
    itesBadge.classList.toggle('show', loopCount>1 || (step===TOTAL && subTap===3));

    // show swipe hint only at very start
    if(step===0) swipeHint.classList.add('show'); else swipeHint.classList.remove('show');
  }

  function advance(velocity){
    playSoftDrip();
    var swipeVel = typeof velocity==='number'?velocity:0;

    if(step===0){
      step=1; subTap=1;
      playSplash(0.42);
      bumpCaption(); pulseFrame();
      launchDropForStep(1, swipeVel);
      render(); return;
    }
    if(step===TOTAL && subTap===3){
      loopCount++;
      bannerTitle.textContent=LOOP_TITLES[(loopCount-1)%LOOP_TITLES.length];
      bannerEyebrow.textContent= loopCount%3===0?'Milestone · Loop '+loopCount:'Complete';
      step=1; subTap=1; emerged=true;
      ['flow1','flow2','flow3','flow4','flow5','flow6','foam1','foam2','foam3','foam4','foam5','foam6','ov1','ov2','ov3','ov4','ov5','ov6','wave1','wave2','drip-mountain','drip-mountain2','sluice-arrow','glow-mill','dam-churn','pond-ripple1','pond-ripple2','wd1','wd2','wd3'].forEach(function(id){ on(id,'on',false); });
      playSplash(0.72);
      bumpCaption(); pulseFrame(); popBadge();
      launchDropForStep(1, swipeVel||900);
      render(); return;
    }

    if(subTap<3){
      subTap++;
      if(subTap===1) playSplash(0.36);
      else if(subTap===2) playSplash(0.52);
      else if(subTap===3){
        // gravity drop triggers the actual wet
        launchDropForStep(step, swipeVel|| (step*140+200));
        celebrateStep(step);
        if(step===TOTAL) emerged=true;
      }
      bumpCaption(); pulseFrame();
    } else {
      step++; subTap=1;
      playSplash(0.42);
      bumpCaption(); pulseFrame();
      launchDropForStep(step-1, 300); // trail
    }
    render();
  }

  /* ===== INPUTS: TAP / SWIPE / FULLSCREEN ===== */
  var startY=0,startX=0,startT=0, isSwiping=false, didSwipe=false, pointerActive=false;
  var SWIPE_THRESHOLD=56, VELOCITY_FACTOR=1;

  function onPointerDown(e){
    // only primary pointer
    if(e.pointerType==='mouse' && e.button!==0) return;
    startY=e.clientY; startX=e.clientX; startT=performance.now();
    isSwiping=false; didSwipe=false; pointerActive=true;
    frame.setPointerCapture(e.pointerId);
    frame.classList.remove('swiping');
  }
  function onPointerMove(e){
    if(!pointerActive) return;
    var dy=e.clientY - startY;
    var dx=e.clientX - startX;
    if(!isSwiping && Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)*1.15){
      isSwiping=true;
      frame.classList.add('swiping');
    }
    if(isSwiping){
      e.preventDefault();
      // visual drag feedback: slight translate of frame content? we use transform on frame
      var drag = Math.min(38, Math.max(0, dy*0.22));
      frame.style.transform = 'translateY('+drag+'px) scale('+(1 - drag*0.004)+')';
    }
  }
  function onPointerUp(e){
    if(!pointerActive) return;
    pointerActive=false;
    frame.classList.remove('swiping');
    frame.style.transform='';
    var dy=e.clientY - startY;
    var dx=e.clientX - startX;
    var dt=performance.now()-startT;
    var absDy=Math.abs(dy);

    if(isSwiping && dy>SWIPE_THRESHOLD && dy > Math.abs(dx)*1.2){
      // swipe down!
      didSwipe=true;
      var vel = dt>0 ? (dy/dt*1000) : 800; // px/s
      spawnRipple(e.clientX, e.clientY);
      advance(vel);
    } else if(!isSwiping && absDy<12 && Math.abs(dx)<12){
      // tap
      spawnRipple(e.clientX, e.clientY);
      advance(0);
    } else if(isSwiping){
      // cancelled swipe, snap back
    }
    // reset after small delay
    setTimeout(function(){ didSwipe=false; isSwiping=false; },60);
  }

  frame.addEventListener('pointerdown', onPointerDown, {passive:false});
  frame.addEventListener('pointermove', onPointerMove, {passive:false});
  frame.addEventListener('pointerup', onPointerUp, {passive:false});
  frame.addEventListener('pointercancel', function(){ pointerActive=false; frame.classList.remove('swiping'); frame.style.transform=''; });
  // prevent context menu / double tap zoom
  frame.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  nextBtn.addEventListener('click', function(e){ e.stopPropagation(); advance(0); });
  resetBtn.addEventListener('click', function(e){
    e.stopPropagation();
    step=0; subTap=0; emerged=false; loopCount=1;
    gravityDrops.forEach(function(d){ d.g.remove(); });
    gravityDrops=[];
    ['seg1','seg2','seg3','seg4','seg5','seg6'].forEach(function(id){ on(id,'wet',false); });
    ['flow1','flow2','flow3','flow4','flow5','flow6','foam1','foam2','foam3','foam4','foam5','foam6','ov1','ov2','ov3','ov4','ov5','ov6','wave1','wave2','drip-mountain','drip-mountain2','sluice-arrow','glow-mill','dam-churn','pond-ripple1','pond-ripple2','wd1','wd2','wd3'].forEach(function(id){ on(id,'on',false); });
    ['wheel-group','gear-large'].forEach(function(id){ var g=document.getElementById(id); if(g) g.classList.remove('spin'); });
    clearHighlights();
    for(var s=1;s<=6;s++) setLabel(s,'physical');
    bannerTitle.textContent=LOOP_TITLES[0]; bannerEyebrow.textContent='Complete';
    itesBadge.classList.remove('show');
    render();
  });

  // Fullscreen
  function updateFsBtn(){
    var isFs = !!document.fullscreenElement || stage.classList.contains('is-fullscreen');
    fsBtn.textContent = isFs ? 'Exit ⛶' : '⛶ Full';
  }
  fsBtn.addEventListener('click', async function(e){
    e.stopPropagation();
    try{
      if(!document.fullscreenElement){
        if(stage.requestFullscreen) await stage.requestFullscreen();
        else stage.classList.add('is-fullscreen');
      } else {
        if(document.exitFullscreen) await document.exitFullscreen();
        stage.classList.remove('is-fullscreen');
      }
    }catch(err){
      // fallback toggle class
      stage.classList.toggle('is-fullscreen');
    }
    updateFsBtn();
  });
  document.addEventListener('fullscreenchange', function(){
    if(!document.fullscreenElement) stage.classList.remove('is-fullscreen');
    updateFsBtn();
  });
  // allow swipe hint to disappear after 3s
  setTimeout(function(){ swipeHint.classList.remove('show'); }, 4200);

  render();
})();
</script>
</body>
</html>
